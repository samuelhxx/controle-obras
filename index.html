  // ============ ALERTAS ============
  function gerarAlertasDetalhados(obra, c) {
    const alertas = [];
    if (obra.status === 'concluida') return alertas;
    const hoje = hojeISO();

    // P1 — Custos acima do contrato
    if (obra.contrato > 0 && c.custoTotal > obra.contrato) {
      alertas.push({ prioridade: 1, tipo: 'red',
        titulo: 'Custos acima do contrato',
        valor: brl(c.custoTotal - obra.contrato) + ' de excedente',
        aba: 'resumo', itemId: null });
    }

    // P1 — Margem crítica (< 20%, só conta se há custos reais)
    if (obra.contrato > 0 && c.custoTotal > 0 && c.margem < 20 && c.custoTotal <= obra.contrato) {
      alertas.push({ prioridade: 1, tipo: 'red',
        titulo: 'Margem crítica — ' + c.margem.toFixed(1) + '%',
        valor: 'Lucro: ' + brl(c.lucro),
        aba: 'resumo', itemId: null });
    }

    // P2 — Prazo vencido ou proximo (<= 7 dias)
    if (obra.dataPrevisao) {
      const diasRestantes = Math.ceil((new Date(obra.dataPrevisao + 'T12:00:00') - new Date(hoje + 'T12:00:00')) / 86400000);
      if (diasRestantes < 0) {
        const d = Math.abs(diasRestantes);
        alertas.push({ prioridade: 2, tipo: 'amber',
          titulo: 'Prazo vencido há ' + d + (d === 1 ? ' dia' : ' dias'),
          valor: dateBR(obra.dataPrevisao),
          aba: 'resumo', itemId: null });
      } else if (diasRestantes <= 7) {
        alertas.push({ prioridade: 2, tipo: 'amber',
          titulo: diasRestantes === 0 ? 'Prazo é hoje' : 'Prazo em ' + diasRestantes + (diasRestantes === 1 ? ' dia' : ' dias'),
          valor: dateBR(obra.dataPrevisao),
          aba: 'resumo', itemId: null });
      }
    }

    // P2 — Recebimentos atrasados (previsto com data < hoje)
    const recbAtrasados = (obra.recebimentos || []).filter(function(r) {
      return r.previsto === true && r.dataPrevista && r.dataPrevista < hoje;
    });
    if (recbAtrasados.length > 0) {
      const totalAtrasado = recbAtrasados.reduce(function(s, r) { return s + Number(r.valor || 0); }, 0);
      const primeiro = recbAtrasados[0];
      const n = recbAtrasados.length;
      alertas.push({ prioridade: 2, tipo: 'amber',
        titulo: n === 1 ? 'Recebimento atrasado · prev. ' + dateBR(primeiro.dataPrevista) : n + ' recebimentos atrasados',
        valor: brl(totalAtrasado),
        aba: 'recebimentos', itemId: n === 1 ? ('recb-' + primeiro.id) : null });
    }

    // P2 — Empreitada pendente E obra com prazo vencido
    if (obra.dataPrevisao && obra.dataPrevisao < hoje) {
      const empsNaoPagas = (obra.empreitadas || []).filter(function(e) { return !e.pago; });
      if (empsNaoPagas.length > 0) {
        const totalPendente = empsNaoPagas.reduce(function(s, e) {
          const ads = (e.adiantamentos || []).reduce(function(a, x) { return a + Number(x.valor || 0); }, 0);
          return s + Math.max(0, Number(e.valor || 0) - ads);
        }, 0);
        const primeiraEmp = empsNaoPagas[0];
        const n = empsNaoPagas.length;
        alertas.push({ prioridade: 2, tipo: 'amber',
          titulo: n === 1 ? '"' + primeiraEmp.nome + '" pendente e obra vencida' : n + ' empreitadas pendentes e obra vencida',
          valor: brl(totalPendente),
          aba: 'empreitada', itemId: n === 1 ? ('emp-item-' + primeiraEmp.id) : null });
      }
    }

    // P2 — Entrada prevista hoje
    const recbHoje = (obra.recebimentos || []).filter(function(r) {
      return r.previsto === true && r.dataPrevista === hoje;
    });
    if (recbHoje.length > 0) {
      const maisMaior = recbHoje.reduce(function(m, r) { return Number(r.valor || 0) > Number(m.valor || 0) ? r : m; }, recbHoje[0]);
      alertas.push({ prioridade: 2, tipo: 'green',
        titulo: 'Entrada prevista hoje',
        valor: brl(maisMaior.valor),
        aba: 'recebimentos', itemId: 'recb-' + maisMaior.id });
    }

    // P3 — Próxima entrada (1–7 dias), só se não há entrada hoje
    if (recbHoje.length === 0) {
      const recbProximos = (obra.recebimentos || []).filter(function(r) {
        if (!r.previsto || !r.dataPrevista || r.dataPrevista <= hoje) return false;
        const dias = Math.ceil((new Date(r.dataPrevista + 'T12:00:00') - new Date(hoje + 'T12:00:00')) / 86400000);
        return dias <= 7;
      });
      if (recbProximos.length > 0) {
        const proximo = recbProximos.sort(function(a, b) { return a.dataPrevista < b.dataPrevista ? -1 : 1; })[0];
        const dias = Math.ceil((new Date(proximo.dataPrevista + 'T12:00:00') - new Date(hoje + 'T12:00:00')) / 86400000);
        alertas.push({ prioridade: 3, tipo: 'green',
          titulo: dias === 1 ? 'Entrada prevista amanhã' : 'Próxima entrada em ' + dias + ' dias',
          valor: brl(proximo.valor),
          aba: 'recebimentos', itemId: 'recb-' + proximo.id });
      }
    }

    alertas.sort(function(a, b) { return a.prioridade - b.prioridade; });
    return alertas;
  }

  function gerarAlertas(obra, c) {
    const detalhados = gerarAlertasDetalhados(obra, c);

  // ============ EXPORT CSV ============
  function exportarCSV() {
    const obra = getObra(obraAtualId);
    if (!obra) return;
    const linhas = [['Data', 'Tipo', 'Descrição', 'Valor (R$)']];
    (obra.diarias || []).sort((a,b) => a.data.localeCompare(b.data)).forEach(d => {
      const periodoTxt = d.periodo === 'meio' ? ' (meio período)' : '';
      linhas.push([d.data, 'Diária', d.trabNome + (d.marmita ? ' + marmita' : '') + periodoTxt, d.valor]);
    });
    (obra.gastosAvulsos || []).sort((a,b) => a.data.localeCompare(b.data)).forEach(g => {
      linhas.push([g.data, getCategoriaNome(g.categoria), g.descricao || 'Gasto avulso', g.valor]);
    });
    (obra.empreitadas || []).forEach(e => {
      if (e.pago) linhas.push(['-', 'Empreitada', e.nome, e.valor]);
      if (e.bonusPago) linhas.push(['-', 'Bônus empreitada', e.nome, e.bonus]);
    });
    (obra.recebimentos || []).sort((a,b) => a.data.localeCompare(b.data)).forEach(r => {
      linhas.push([r.data, 'Recebimento', r.descricao || 'Recebimento', r.valor]);
    });
    const csv = linhas.map(l => l.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = obra.nome.replace(/[^a-zA-Z0-9À-ɏ]/g, '_') + '_historico.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function abrirPainel() {

    window.scrollTo(0, 0);

  function renderPainel() {
    let html = '<div class="header">';
    html += '<div class="header-left">';
    html += '<div class="header-title obra-title">Painel Comparativo</div>';
    html += '</div>';
    html += '<div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">';
    html += '<button class="btn-theme" onclick="toggleTema()" title="Alternar tema">' + (temaEscuro ? '☀' : '◑') + '</button>';
    html += '<button class="btn-back" onclick="voltarHome()">← Voltar</button>';
    html += '</div></div>';

    if (estado.obras.length === 0) {
      html += '<div class="card"><div class="empty">Nenhuma obra cadastrada.</div></div>';
      return html;
    }

    let totalContrato = 0, totalLucro = 0, totalRecebido = 0;
    const obrasCalc = estado.obras.map(o => {
      const c = calcularObra(o);
      totalContrato += Number(o.contrato || 0);
      totalLucro += c.lucro;
      totalRecebido += c.totalRecebido;
      return { o, c };
    }).sort((a, b) => a.c.margem - b.c.margem);

    html += '<div class="resumo-cols">';
    html += '<div class="card"><div class="card-title">RECEITA TOTAL</div><div class="info-value">' + brl(totalContrato) + '</div></div>';
    html += '<div class="card"><div class="card-title">LUCRO PROJETADO</div><div class="info-value ' + (totalLucro >= 0 ? 'green' : 'red') + '">' + brl(totalLucro) + '</div></div>';
    html += '<div class="card"><div class="card-title">TOTAL RECEBIDO</div><div class="info-value green">' + brl(totalRecebido) + '</div></div>';
    html += '</div>';

    html += '<div class="card"><div class="card-title">OBRAS — MENOR MARGEM PRIMEIRO</div>';
    html += '<div style="overflow-x:auto;">';
    html += '<table class="painel-table"><thead><tr>';
    html += '<th>Obra</th>';
    html += '<th class="painel-col-hide">Contrato</th>';
    html += '<th class="painel-col-hide">Custo</th>';
    html += '<th>Lucro</th>';
    html += '<th>Margem</th>';
    html += '<th class="painel-col-hide">Recebido</th>';
    html += '<th>Status</th>';
    html += '</tr></thead><tbody>';

    obrasCalc.forEach(({ o, c }) => {
      const status = getStatusInfo(o.status);
      const margemColor = c.margem < 0 ? 'var(--red)' : c.margem < 10 ? 'var(--amber)' : 'var(--green)';
      const barWidth = Math.max(2, Math.min(80, (Math.abs(c.margem) / 50) * 80));
      let prazoBadge = '';
      if (o.dataPrevisao && o.status === 'andamento') {
        const dias = Math.round((new Date(o.dataPrevisao + 'T12:00:00') - new Date()) / 86400000);
        if (dias < 0) prazoBadge = ' <span class="badge red">Vencida</span>';
        else if (dias <= 15) prazoBadge = ' <span class="badge orange">+' + dias + 'd</span>';
      }
      html += '<tr onclick="abrirObra(\'' + o.id + '\')">';
      html += '<td><div class="painel-obra-nome">' + escapeHtml(o.nome) + '</div>';
      if (o.cliente) html += '<div class="painel-obra-cliente">' + escapeHtml(o.cliente) + '</div>';
      html += '</td>';
      html += '<td class="painel-col-hide" style="font-size:14px;font-weight:600;color:var(--ink)">' + brl(o.contrato || 0) + '</td>';
      html += '<td class="painel-col-hide" style="font-size:14px;color:var(--ink-2)">' + brl(c.custoTotal) + '</td>';
      html += '<td style="font-size:14px;font-weight:700;color:' + (c.lucro >= 0 ? 'var(--green)' : 'var(--red)') + '">' + brl(c.lucro) + '</td>';
      html += '<td><div class="margem-bar-wrap"><div class="margem-bar" style="width:' + barWidth + 'px;background:' + margemColor + '"></div><span style="font-size:13px;font-weight:700;color:' + margemColor + '">' + c.margem.toFixed(1) + '%</span></div></td>';
      html += '<td class="painel-col-hide" style="font-size:13px;color:var(--green)">' + brl(c.totalRecebido) + '</td>';
      html += '<td><span class="badge ' + status.cor + '">' + status.nome + '</span>' + prazoBadge + '</td>';
      html += '</tr>';
    });

    html += '</tbody></table></div></div>';
    return html;
  }

  function _buildEmpreitadasPreviewHTML(obra) {
    const empreitadas = obra.empreitadas || [];
    if (empreitadas.length === 0) {
      return '<div class="card-title">EMPREITADAS DA OBRA</div><div class="empty">Nenhuma empreitada cadastrada nesta obra.</div>';
    }
    let totalPago = 0; let totalAPagar = 0;
    empreitadas.forEach(e => {
      if (e.pago) totalPago += Number(e.valor || 0); else totalAPagar += Number(e.valor || 0);
      if (e.bonus) { if (e.bonusPago) totalPago += Number(e.bonus || 0); else totalAPagar += Number(e.bonus || 0); }
    });
    let html = '<div class="card-title">EMPREITADAS DA OBRA</div>';
    empreitadas.forEach(e => {
      const statusCor = e.pago ? 'var(--green)' : 'var(--amber)';
      const statusTxt = e.pago ? 'Pago' : 'A pagar';
      html += '<div class="lancamento">';
      html += '<div><div class="lanc-desc">' + escapeHtml(e.nome) + '</div>';
      if (Number(e.bonus || 0) > 0) {
        const bonusCor = e.bonusPago ? 'var(--green)' : 'var(--ink-3)';
        html += '<div class="lanc-data">Bônus: ' + brl(e.bonus) + ' — <span style="color:' + bonusCor + ';">' + (e.bonusPago ? 'Pago' : 'A pagar') + '</span></div>';
      }
      html += '</div>';
      html += '<div class="lanc-right"><div><div class="lanc-valor">' + brl(e.valor) + '</div>';
      html += '<div style="font-size:11px;font-weight:600;color:' + statusCor + ';text-align:right;margin-top:2px;">' + statusTxt + '</div></div></div></div>';
    });
    html += '<div class="rel-total-dinheiro" style="margin-top:12px;">';
    html += '<span class="rel-total-label">TOTAL PAGO</span><span class="rel-total-valor">' + brl(totalPago) + '</span></div>';
    if (totalAPagar > 0) {
      html += '<div class="rel-marmita-line"><span>A pagar</span><span>' + brl(totalAPagar) + '</span></div>';
    }
    return html;
  }

  function _buildEmpreitadaUnicaPreviewHTML(obra, empId) {
    const e = (obra.empreitadas || []).find(x => x.id === empId);
    if (!e) return '<div class="empty">Empreitada não encontrada.</div>';
    const adList = e.adiantamentos || [];
    const totalAd = adList.reduce((s,a) => s + Number(a.valor||0), 0);
    const saldo = Math.max(0, Number(e.valor||0) - totalAd);
    const statusSaldoCor = e.pago ? 'var(--green)' : 'var(--amber)';
    const statusSaldoTxt = e.pago ? 'Pago' : 'A pagar';

    let html = '<div class="card-title">EMPREITADA: ' + escapeHtml(e.nome).toUpperCase() + '</div>';

    // Valor acordado
    html += '<div class="linha"><div class="linha-label">Valor acordado</div><div class="linha-valor">' + brl(e.valor) + '</div></div>';

    // Adiantamentos
    if (adList.length > 0) {
      html += '<div style="margin:12px 0 0;padding-top:10px;border-top:1px dashed rgba(0,0,0,0.08);">';
      html += '<div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--ink-3);text-transform:uppercase;margin-bottom:8px;">Adiantamentos</div>';
      html += '<table class="rel-table"><thead><tr><th>Data</th><th>Descrição</th><th style="text-align:right;">Valor</th></tr></thead><tbody>';
      adList.forEach(a => {
        html += '<tr><td>' + dateBR(a.data) + '</td><td>' + escapeHtml(a.descricao) + '</td><td style="text-align:right;">' + brl(a.valor) + '</td></tr>';
      });
      html += '</tbody></table>';
      html += '<div class="linha"><div class="linha-label">Total adiantamentos</div><div class="linha-valor" style="color:var(--ink-3);">– ' + brl(totalAd) + '</div></div>';
      html += '</div>';
    }

    // Saldo a pagar
    html += '<div class="linha bold" style="border-top:1px solid rgba(0,0,0,0.08);margin-top:6px;padding-top:8px;">';
    html += '<div class="linha-label">Saldo a pagar</div>';
    html += '<div class="linha-valor" style="color:' + statusSaldoCor + ';">' + brl(saldo) + ' <span style="font-size:10px;font-weight:600;">(' + statusSaldoTxt + ')</span></div></div>';

    // Bônus
    if (Number(e.bonus || 0) > 0) {
      const bonusCor = e.bonusPago ? 'var(--green)' : 'var(--ink-3)';
      html += '<div class="linha" style="margin-top:4px;"><div class="linha-label">Bônus (entrega no prazo)</div>';
      html += '<div class="linha-valor" style="font-size:13px;">'+brl(e.bonus)+' <span style="font-size:10px;color:'+bonusCor+';">' + (e.bonusPago ? 'Pago' : 'A pagar') + '</span></div></div>';
    }

    // Totais finais
    const totalPago = totalAd + (e.pago ? saldo : 0) + (e.bonusPago ? Number(e.bonus||0) : 0);
    const totalAPagar = (e.pago ? 0 : saldo) + (Number(e.bonus||0) > 0 && !e.bonusPago ? Number(e.bonus||0) : 0);
    html += '<div class="rel-total-dinheiro" style="margin-top:12px;">';
    html += '<span class="rel-total-label">TOTAL PAGO</span><span class="rel-total-valor">' + brl(totalPago) + '</span></div>';
    if (totalAPagar > 0) {
      html += '<div class="rel-marmita-line"><span>A pagar</span><span>' + brl(totalAPagar) + '</span></div>';
    }
    return html;
  }

  function buildRelatorioHTML(obra, mes, quinzena, trabId) {
    if (trabId === 'empreitadas') return _buildEmpreitadasPreviewHTML(obra);
    if (typeof trabId === 'string' && trabId.startsWith('emp:')) return _buildEmpreitadaUnicaPreviewHTML(obra, trabId.slice(4));
    if (!mes) return '<div class="empty">Selecione um mês.</div>';
    const parts = mes.split('-');
    const ano = parseInt(parts[0]);
    const mesNum = parseInt(parts[1]);
    const mesNomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const mesNome = mesNomes[mesNum - 1] || '';
    const diaFim = quinzena === 1 ? 15 : new Date(ano, mesNum, 0).getDate();
    const isoInicio = mes + '-' + (quinzena === 1 ? '01' : '16');
    const isoFim = mes + '-' + String(diaFim).padStart(2, '0');
    const periodoLabel = (quinzena === 1 ? '1ª Quinzena' : '2ª Quinzena') + ' — ' + mesNome + '/' + ano;

    const diasPeriodo = (obra.diarias || []).filter(d => d.data >= isoInicio && d.data <= isoFim);

    // Agrupa diárias por trabalhador
    const grupos = {};
    diasPeriodo.forEach(d => {
      if (!grupos[d.trabId]) grupos[d.trabId] = { nome: d.trabNome, dias: [] };
      grupos[d.trabId].dias.push(d);
    });

    // Filtra por trabalhador se não for 'todos'
    let trabIds = Object.keys(grupos);
    if (trabId !== 'todos') trabIds = trabIds.filter(id => id === trabId);

    // Trabalhadores do relatório sem diárias no período (mas selecionados)
    if (trabId !== 'todos') {
      const trab = (obra.trabalhadores || []).find(t => t.id === trabId);
      if (trab && !grupos[trabId]) trabIds = [trabId];
      if (trab && !grupos[trabId]) grupos[trabId] = { nome: trab.nome, dias: [] };
    }

    let html = '<div class="card-title">' + periodoLabel.toUpperCase() + '</div>';

    if (trabIds.length === 0) {
      return html + '<div class="empty">Nenhum lançamento neste período.</div>';
    }

    // Seção por trabalhador
    trabIds.forEach(tid => {
      const g = grupos[tid];
      const diasOrdenados = g.dias.slice().sort((a, b) => a.data.localeCompare(b.data));
      let totalCash = 0;
      let totalMarmita = 0;
      diasOrdenados.forEach(d => {
        const base = d.periodo === 'meio' ? d.diaria / 2 : d.diaria;
        totalCash += base;
        if (d.marmita) totalMarmita += (d.valor - base);
      });

      html += '<div class="rel-trab-section">';
      html += '<div class="rel-trab-nome">' + escapeHtml(g.nome) + '</div>';
      html += '<div class="rel-trab-sub">' + diasOrdenados.length + ' dia(s) no período</div>';

      if (diasOrdenados.length === 0) {
        html += '<div class="empty" style="padding:12px 0 4px;">Nenhum lançamento neste período.</div>';
      } else {
        html += '<table class="rel-table"><thead><tr>';
        html += '<th>Data</th><th>Período</th><th>Diária (R$)</th><th>Marmita (R$)</th>';
        html += '</tr></thead><tbody>';
        diasOrdenados.forEach(d => {
          const base = d.periodo === 'meio' ? d.diaria / 2 : d.diaria;
          const marmitaAmt = d.marmita ? (d.valor - base) : 0;
          html += '<tr>';
          html += '<td>' + dateBR(d.data) + '</td>';
          html += '<td>' + (d.periodo === 'meio' ? 'Meio período' : 'Completo') + '</td>';
          html += '<td style="font-weight:600; color:var(--ink);">' + brl(base) + '</td>';
          html += '<td style="color:var(--ink-3);">' + (marmitaAmt > 0 ? brl(marmitaAmt) : '—') + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table>';

        html += '<div class="rel-total-dinheiro">';
        html += '<span class="rel-total-label">TOTAL A RECEBER EM DINHEIRO</span>';
        html += '<span class="rel-total-valor">' + brl(totalCash) + '</span>';
        html += '</div>';
        if (totalMarmita > 0) {
          html += '<div class="rel-marmita-line">';
          html += '<span>Alimentação fornecida no período</span>';
          html += '<span>' + brl(totalMarmita) + '</span>';
          html += '</div>';
        }
      }
      html += '</div>';
    });

    return html;
  }

  function gerarPDFRelatorio() {
    const obra = getObra(obraAtualId);
    if (!obra) return;
    if (window.jspdf) {
      _gerarPDF(obra);
    } else {
      const btn = document.querySelector('.rel-pdf-btn');
      if (btn) { btn.textContent = 'Carregando...'; btn.disabled = true; }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = () => {
        if (btn) { btn.textContent = 'Exportar PDF'; btn.disabled = false; }
        _gerarPDF(obra);
      };
      s.onerror = () => { alert('Erro ao carregar biblioteca de PDF. Verifique sua conexão.'); };
      document.head.appendChild(s);
    }
  }

  function _gerarPDFEmpreitadas(obra) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const PW = 210; const PH = 297;
    const ML = 15; const MR = 15; const CW = PW - ML - MR;
    const mesNomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const parts = relatorioMes.split('-');
    const ano = parseInt(parts[0]);
    const mesNum = parseInt(parts[1]);
    const mesNome = mesNomes[mesNum - 1] || '';
    const periodoLabel = (relatorioQuinzena === 1 ? '1ª Quinzena' : '2ª Quinzena') + ' — ' + mesNome + '/' + ano;

    doc.setFillColor(115, 1, 140);
    doc.rect(0, 0, PW, 28, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(16); doc.setFont('helvetica', 'bold');
    doc.text('AS CONSTRUCTION', ML, 11);
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('Relatório de Empreitadas', ML, 18);

    let y = 36;
    doc.setTextColor(80, 80, 80); doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('Obra: ', ML, y); doc.setTextColor(30, 30, 30); doc.setFont('helvetica', 'bold');
    doc.text(obra.nome, ML + 11, y); y += 6;
    doc.setTextColor(80, 80, 80); doc.setFont('helvetica', 'normal');
    doc.text('Período de referência: ', ML, y); doc.setTextColor(30, 30, 30); doc.setFont('helvetica', 'bold');
    doc.text(periodoLabel, ML + 38, y); y += 12;

    doc.setDrawColor(220, 220, 220); doc.line(ML, y - 4, PW - MR, y - 4);
    doc.setTextColor(100, 100, 100); doc.setFontSize(8); doc.setFont('helvetica', 'bold');
    doc.text('EMPREITADAS DA OBRA', ML, y); y += 8;

    const empreitadas = obra.empreitadas || [];
    let totalPago = 0; let totalAPagar = 0;

    const checkPage = (needed) => {
      if (y + needed > PH - 20) {
        doc.setTextColor(180, 180, 180); doc.setFontSize(8); doc.setFont('helvetica', 'normal');
        doc.text('Gerado em ' + dateBR(hojeISO()) + ' — AS Construction', ML, PH - 8);
        doc.addPage();
        doc.setFillColor(115, 1, 140); doc.rect(0, 0, PW, 28, 'F');
        doc.setTextColor(255, 255, 255); doc.setFontSize(16); doc.setFont('helvetica', 'bold');
        doc.text('AS CONSTRUCTION', ML, 11);
        y = 36;
      }
    };

    if (empreitadas.length === 0) {
      doc.setTextColor(150, 150, 150); doc.setFontSize(9);
      doc.text('Nenhuma empreitada cadastrada.', ML, y); y += 8;
    } else {
      // Table header
      doc.setFillColor(245, 245, 245); doc.rect(ML, y - 4, CW, 7, 'F');
      doc.setTextColor(100, 100, 100); doc.setFontSize(8); doc.setFont('helvetica', 'bold');
      doc.text('EMPREITEIRO', ML + 1, y); doc.text('VALOR', ML + 100, y); doc.text('STATUS', PW - MR - 2, y, { align: 'right' });
      y += 5; doc.setDrawColor(220, 220, 220); doc.line(ML, y - 2, PW - MR, y - 2);

      empreitadas.forEach(e => {
        checkPage(10);
        doc.setTextColor(30, 30, 30); doc.setFontSize(9); doc.setFont('helvetica', 'bold');
        doc.text(escapeHtml(e.nome), ML + 1, y);
        doc.setFont('helvetica', 'normal');
        doc.text(brl(e.valor), ML + 100, y);
        const statusTxt = e.pago ? 'Pago' : 'A pagar';
        doc.setTextColor(e.pago ? 5 : 180, e.pago ? 150 : 120, e.pago ? 105 : 0);
        doc.text(statusTxt, PW - MR - 2, y, { align: 'right' });

        doc.text('A pagar:', ML + 2, y);

    doc.setTextColor(180, 180, 180); doc.setFontSize(8); doc.setFont('helvetica', 'normal');

    doc.save('relatorio-empreitadas-' + relatorioMes + '-Q' + relatorioQuinzena + '.pdf');
  }

  function _gerarPDF(obra) {
    if (relatorioTrabId === 'empreitadas') { _gerarPDFEmpreitadas(obra); return; }
    if (typeof relatorioTrabId === 'string' && relatorioTrabId.startsWith('emp:')) { _gerarPDFEmpreitadaUnica(obra, relatorioTrabId.slice(4)); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const PW = 210; const PH = 297;
    const ML = 15; const MR = 15; const CW = PW - ML - MR;

    const mesNomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const parts = relatorioMes.split('-');
    const ano = parseInt(parts[0]);
    const mesNum = parseInt(parts[1]);
    const mesNome = mesNomes[mesNum - 1] || '';
    const diaFim = relatorioQuinzena === 1 ? 15 : new Date(ano, mesNum, 0).getDate();
    const isoInicio = relatorioMes + '-' + (relatorioQuinzena === 1 ? '01' : '16');
    const isoFim = relatorioMes + '-' + String(diaFim).padStart(2, '0');
    const periodoLabel = (relatorioQuinzena === 1 ? '1ª Quinzena' : '2ª Quinzena') + ' — ' + mesNome + '/' + ano;

    const diasPeriodo = (obra.diarias || []).filter(d => d.data >= isoInicio && d.data <= isoFim);
    const grupos = {};
    diasPeriodo.forEach(d => {
      if (!grupos[d.trabId]) grupos[d.trabId] = { nome: d.trabNome, dias: [] };
      grupos[d.trabId].dias.push(d);
    });
    let trabIds = Object.keys(grupos);
    if (relatorioTrabId !== 'todos') {
      trabIds = trabIds.filter(id => id === relatorioTrabId);
      if (!grupos[relatorioTrabId]) {
        const t = (obra.trabalhadores || []).find(t => t.id === relatorioTrabId);
        if (t) { trabIds = [relatorioTrabId]; grupos[relatorioTrabId] = { nome: t.nome, dias: [] }; }
      }
    }

    let pageNum = 1;
    const addHeader = () => {
      doc.setFillColor(115, 1, 140);
      doc.rect(0, 0, PW, 28, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16); doc.setFont('helvetica', 'bold');
      doc.text('AS CONSTRUCTION', ML, 11);
      doc.setFontSize(9); doc.setFont('helvetica', 'normal');
      doc.text('Relatório de Pagamento', ML, 18);
      doc.setFontSize(8);
      doc.text('Pág. ' + pageNum, PW - MR, 18, { align: 'right' });
    };

    const addFooter = () => {
      doc.setTextColor(180, 180, 180);
      doc.setFontSize(8); doc.setFont('helvetica', 'normal');
      doc.text('Gerado em ' + dateBR(hojeISO()) + ' — AS Construction', ML, PH - 8);
    };

    addHeader();
    let y = 36;

    // Info block
    doc.setTextColor(80, 80, 80);
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('Obra: ', ML, y); doc.setTextColor(30, 30, 30); doc.setFont('helvetica', 'bold');
    doc.text(obra.nome, ML + 11, y);
    y += 6;
    doc.setTextColor(80, 80, 80); doc.setFont('helvetica', 'normal');
    doc.text('Período: ', ML, y); doc.setTextColor(30, 30, 30); doc.setFont('helvetica', 'bold');
    doc.text(periodoLabel, ML + 17, y);
    if (relatorioTrabId !== 'todos' && grupos[relatorioTrabId]) {
      y += 6;
      doc.setTextColor(80, 80, 80); doc.setFont('helvetica', 'normal');
      doc.text('Trabalhador: ', ML, y); doc.setTextColor(30, 30, 30); doc.setFont('helvetica', 'bold');
      doc.text(grupos[relatorioTrabId].nome, ML + 24, y);
    }
    y += 10;

    // Line under info
    doc.setDrawColor(220, 220, 220);
    doc.line(ML, y - 4, PW - MR, y - 4);

    const checkPage = (needed) => {
      if (y + needed > PH - 20) {
        addFooter(); doc.addPage(); pageNum++;
        addHeader(); y = 36;
      }
    };

    trabIds.forEach((tid, idx) => {
      const g = grupos[tid];
      const diasOrdenados = g.dias.slice().sort((a, b) => a.data.localeCompare(b.data));
      let totalCash = 0; let totalMarmita = 0;
      diasOrdenados.forEach(d => {
        const base = d.periodo === 'meio' ? d.diaria / 2 : d.diaria;
        totalCash += base;
        if (d.marmita) totalMarmita += (d.valor - base);
      });

      checkPage(20);
      doc.setTextColor(30, 30, 30); doc.setFontSize(12); doc.setFont('helvetica', 'bold');
      doc.text(g.nome, ML, y); y += 5;
      doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(120, 120, 120);
      doc.text(diasOrdenados.length + ' dia(s) — ' + periodoLabel, ML, y); y += 8;

      if (diasOrdenados.length === 0) {
        doc.setTextColor(150, 150, 150); doc.setFontSize(9);
        doc.text('Nenhum lançamento neste período.', ML, y); y += 8;
      } else {
        // Table header
        checkPage(10);
        doc.setFillColor(245, 245, 245);
        doc.rect(ML, y - 4, CW, 7, 'F');
        doc.setTextColor(100, 100, 100); doc.setFontSize(8); doc.setFont('helvetica', 'bold');
        doc.text('DATA', ML + 1, y); doc.text('PERÍODO', ML + 28, y);
        doc.text('DIÁRIA (R$)', ML + 70, y); doc.text('MARMITA (R$)', ML + 110, y);
        y += 5;
        doc.setDrawColor(220, 220, 220); doc.line(ML, y - 2, PW - MR, y - 2);

        diasOrdenados.forEach(d => {
          checkPage(7);
          const base = d.periodo === 'meio' ? d.diaria / 2 : d.diaria;
          const marmitaAmt = d.marmita ? (d.valor - base) : 0;
          doc.setTextColor(60, 60, 60); doc.setFontSize(9); doc.setFont('helvetica', 'normal');
          doc.text(dateBR(d.data), ML + 1, y);
          doc.text(d.periodo === 'meio' ? 'Meio período' : 'Completo', ML + 28, y);
          doc.setFont('helvetica', 'bold'); doc.setTextColor(30, 30, 30);
          doc.text(brl(base), ML + 70, y);
          doc.setFont('helvetica', 'normal'); doc.setTextColor(120, 120, 120);
          doc.text(marmitaAmt > 0 ? brl(marmitaAmt) : '—', ML + 110, y);
          y += 6;
          doc.setDrawColor(235, 235, 235); doc.line(ML, y - 2, PW - MR, y - 2);
        });

        y += 4;
        checkPage(12);
        // Total em dinheiro
        doc.setFillColor(243, 229, 247);
        doc.rect(ML, y - 4, CW, 10, 'F');
        doc.setTextColor(115, 1, 140); doc.setFontSize(10); doc.setFont('helvetica', 'bold');
        doc.text('TOTAL A RECEBER EM DINHEIRO', ML + 2, y + 1);
        doc.text(brl(totalCash), PW - MR - 2, y + 1, { align: 'right' });
        y += 12;

        if (totalMarmita > 0) {
          checkPage(8);
          doc.setTextColor(120, 120, 120); doc.setFontSize(9); doc.setFont('helvetica', 'normal');
          doc.text('Alimentação fornecida no período:', ML + 2, y);
          doc.text(brl(totalMarmita), PW - MR - 2, y, { align: 'right' });
          y += 8;
        }
      }

      // Divider between workers
      if (idx < trabIds.length - 1) {
        y += 4; checkPage(6);
        doc.setDrawColor(200, 200, 200); doc.line(ML, y - 2, PW - MR, y - 2); y += 4;
      }
    });

    addFooter();
    const trabNomeSlug = relatorioTrabId === 'todos' ? 'equipe' : (grupos[relatorioTrabId]?.nome || 'trabalhador').replace(/\s+/g, '-').toLowerCase();
    doc.save('relatorio-' + trabNomeSlug + '-' + relatorioMes + '-Q' + relatorioQuinzena + '.pdf');
  }

  function calcOrcDados() {
    const trabalhadores = parseFloat(document.getElementById('orc-trab')?.value) || 0;
    const dias = parseFloat(document.getElementById('orc-dias')?.value) || 0;
    const valorDia = parseNum(document.getElementById('orc-valordia')?.value || '0');
    const totalDiarias = trabalhadores * dias * valorDia;
    const totalEmpreitadas = parseNum(document.getElementById('orc-empreitadas')?.value || '0');
    const totalMaterial = parseNum(document.getElementById('orc-material')?.value || '0');
    const totalAvulsos = parseNum(document.getElementById('orc-avulsos')?.value || '0');
    const custoTotal = totalDiarias + totalEmpreitadas + totalMaterial + totalAvulsos;
    const impostoPct = parseFloat(document.getElementById('orc-imposto')?.value) || 0;
    const modo = document.querySelector('.orc-modo-pill.active')?.dataset.modo || 'A';
    const margemDesejada = parseFloat(document.getElementById('orc-margem')?.value) || 0;
    const budgetCliente = parseNum(document.getElementById('orc-budget')?.value || '0');

    let precoVenda = 0, imposto = 0, lucro = 0, margem = 0;
    if (modo === 'A') {
      const divisor = 1 - impostoPct / 100 - margemDesejada / 100;
      precoVenda = divisor > 0 ? custoTotal / divisor : 0;
      imposto = precoVenda * impostoPct / 100;
      lucro = precoVenda - custoTotal - imposto;
      margem = margemDesejada;
    } else {
      precoVenda = budgetCliente;
      imposto = budgetCliente * impostoPct / 100;
      lucro = budgetCliente - custoTotal - imposto;
      margem = budgetCliente > 0 ? (lucro / budgetCliente) * 100 : 0;
    }
    return { trabalhadores, dias, valorDia, totalDiarias, totalEmpreitadas, totalMaterial, totalAvulsos, custoTotal, impostoPct, modo, margemDesejada, budgetCliente, precoVenda, imposto, lucro, margem };
  }

  function saudeInfo(margem) {
    if (margem >= 20) return { classe: 'verde', label: 'Saudável' };
    if (margem >= 10) return { classe: 'amber', label: 'Apertada' };
    if (margem >= 0)  return { classe: 'critica', label: 'Crítica' };
    return { classe: 'prejuizo', label: 'Prejuízo' };
  }

  function calcularOrcamentoLive() {
    const el = document.getElementById('orc-resultado');
    if (!el) return;
    const d = calcOrcDados();
    const saude = saudeInfo(d.margem);

    const diariasLine = '<div class="linha"><div class="linha-label">Diárias (' + d.trabalhadores + ' × ' + d.dias + ' dias × ' + brl(d.valorDia) + ')</div><div class="linha-valor">' + brl(d.totalDiarias) + '</div></div>';
    const empLine = '<div class="linha"><div class="linha-label">Empreitadas previstas</div><div class="linha-valor">' + brl(d.totalEmpreitadas) + '</div></div>';
    const matLine = '<div class="linha"><div class="linha-label">Material previsto</div><div class="linha-valor">' + brl(d.totalMaterial) + '</div></div>';
    const avulsosLine = '<div class="linha"><div class="linha-label">Gastos avulsos previstos</div><div class="linha-valor">' + brl(d.totalAvulsos) + '</div></div>';
    const custoLine = '<div class="linha bold divider"><div class="linha-label">Custo total previsto</div><div class="linha-valor">' + brl(d.custoTotal) + '</div></div>';
    const impostoLine = '<div class="linha"><div class="linha-label">Imposto (' + d.impostoPct + '%)</div><div class="linha-valor">' + brl(d.imposto) + '</div></div>';

    let precoLine = '';
    if (d.modo === 'A') {
      precoLine = '<div class="linha bold divider-purple"><div class="linha-label" style="color:var(--purple); font-weight:700;">PREÇO DE VENDA SUGERIDO</div><div class="linha-valor" style="font-size:18px; color:var(--purple);">' + brl(d.precoVenda) + '</div></div>';
    } else {
      precoLine = '<div class="linha bold divider-purple"><div class="linha-label" style="color:var(--purple); font-weight:700;">BUDGET DO CLIENTE</div><div class="linha-valor" style="font-size:18px; color:var(--purple);">' + brl(d.precoVenda) + '</div></div>';
    }

    const lucroColor = d.lucro >= 0 ? 'var(--green)' : 'var(--red)';
    const lucroLine = '<div class="linha" style="margin-top:8px;"><div class="linha-label">Lucro líquido</div><div class="linha-valor" style="font-size:17px; font-weight:800; color:' + lucroColor + ';">' + brl(d.lucro) + '</div></div>';
    const margemLine = '<div class="linha"><div class="linha-label">Margem</div><div class="linha-valor">' + d.margem.toFixed(1) + '%</div></div>';
    const saudeLine = '<span class="orc-saude ' + saude.classe + '">' + saude.label + '</span>';

    el.innerHTML = diariasLine + empLine + matLine + avulsosLine + custoLine + impostoLine + precoLine + lucroLine + margemLine + saudeLine;

    const diariaTotal = document.getElementById('orc-diaria-total');
    if (diariaTotal) diariaTotal.textContent = '= ' + brl(d.totalDiarias);
  }

  function trocarModoOrc(modo) {
    document.querySelectorAll('.orc-modo-pill').forEach(p => {
      p.classList.toggle('active', p.dataset.modo === modo);
    });
    const campoA = document.getElementById('orc-campo-A');
    const campoB = document.getElementById('orc-campo-B');
    if (campoA) campoA.style.display = modo === 'A' ? 'block' : 'none';
    if (campoB) campoB.style.display = modo === 'B' ? 'block' : 'none';
    calcularOrcamentoLive();
  }

  function salvarOrcamento() {
    const nome = document.getElementById('orc-nome')?.value?.trim() || '';
    if (!nome) { alert('Informe o nome do orçamento.'); return; }
    const d = calcOrcDados();
    if (d.custoTotal <= 0) { alert('Informe pelo menos um custo para calcular.'); return; }
    const orc = {
      id: 'orc_' + Date.now(),
      nome,
      cliente: document.getElementById('orc-cliente')?.value?.trim() || '',
      impostoPct: d.impostoPct,
      trabalhadores: d.trabalhadores,
      dias: d.dias,
      valorDia: d.valorDia,
      totalEmpreitadas: d.totalEmpreitadas,
      totalMaterial: d.totalMaterial,
      totalAvulsos: d.totalAvulsos,
      modo: d.modo,
      margemDesejada: d.margemDesejada,
      budgetCliente: d.budgetCliente,
      custoTotal: d.custoTotal,
      precoVenda: d.precoVenda,
      lucro: d.lucro,
      margem: d.margem,
      criadaEm: new Date().toISOString()
    };
    orcamentos.push(orc);
    salvarOrcamentos();
    render();

  function excluirOrcamento(id) {
    if (!confirm('Excluir este orçamento?')) return;
    orcamentos = orcamentos.filter(o => o.id !== id);
    salvarOrcamentos();
    render();
  }

  function transformarEmObra(id) {
    const orc = orcamentos.find(o => o.id === id);
    if (!orc) return;
    if (!confirm('Transformar "' + orc.nome + '" em obra?\n\nO orçamento será removido da lista e uma nova obra será criada com o preço sugerido como contrato.')) return;
    const novaObra = {
      id: 'obra_' + Date.now(),
      nome: orc.nome,
      cliente: orc.cliente,
      contrato: orc.precoVenda,
      impostoPct: orc.impostoPct,
      dataInicio: hojeISO(),
      dataPrevisao: '',
      status: 'andamento',
      valorMarmita: 30,
      nota: 'Criada a partir do orçamento salvo em ' + dateBR(orc.criadaEm.split('T')[0]),
      diarias: [],
      gastosAvulsos: [],
      empreitadas: [],
      trabalhadores: [],
      recebimentos: [],
      criadaEm: new Date().toISOString()
    };
    estado.obras.push(novaObra);
    salvar();
    orcamentos = orcamentos.filter(o => o.id !== id);

  function toggleMatUnidadeOutro() {
    const sel = document.getElementById('mat-unidade-sel');
    const div = sel ? sel.parentElement.querySelector('.mat-unidade-outro') : null;
    if (!div) return;
    div.classList.toggle('visivel', sel.value === 'outro');
  }

  function _getMatUnidade() {
    const sel = document.getElementById('mat-unidade-sel');
    if (!sel) return 'unidade';
    if (sel.value === 'outro') {
      const txt = document.getElementById('mat-unidade-txt');
      return (txt && txt.value.trim()) ? txt.value.trim() : 'unidade';
    }
    return sel.value;
  }

  function lancarMaterial() {
    const obra = getObra(obraAtualId);
    if (!obra) return;
    const nome = (document.getElementById('mat-nome').value || '').trim();
    const qtd  = parseNum(document.getElementById('mat-qtd').value);
    const val  = parseNum(document.getElementById('mat-valor').value);
    if (!nome) { alert('Informe o nome do material.'); return; }
    if (qtd <= 0) { alert('Informe uma quantidade válida.'); return; }
    if (val <= 0) { alert('Informe um valor unitário válido.'); return; }
    if (!obra.materiais) obra.materiais = [];
    obra.materiais.push({
      id: 'mat_' + Date.now(),
      nome,
      quantidade: qtd,
      unidade: _getMatUnidade(),
      valorUnit: val,
      data: document.getElementById('mat-data').value || '',
      fornecedor: (document.getElementById('mat-fornecedor').value || '').trim(),
      descricao: (document.getElementById('mat-descricao').value || '').trim(),
      criadoEm: new Date().toISOString()
    });
    salvar();
    materialEditandoId = null;
    render();
    toast('Material adicionado!');
  }

  function editarMaterial(id) {
    materialEditandoId = id;
    render();
    window.scrollTo(0, 0);
  }

  function cancelarEdicaoMaterial() {
    materialEditandoId = null;
    render();
  }

  function salvarEdicaoMaterial(id) {
    const obra = getObra(obraAtualId);
    if (!obra) return;
    const m = (obra.materiais || []).find(function(x) { return x.id === id; });
    if (!m) return;
    const nome = (document.getElementById('mat-nome').value || '').trim();
    const qtd  = parseNum(document.getElementById('mat-qtd').value);
    const val  = parseNum(document.getElementById('mat-valor').value);
    if (!nome) { alert('Informe o nome do material.'); return; }
    if (qtd <= 0) { alert('Informe uma quantidade válida.'); return; }
    if (val <= 0) { alert('Informe um valor unitário válido.'); return; }
    m.nome      = nome;
    m.quantidade = qtd;
    m.unidade   = _getMatUnidade();
    m.valorUnit = val;
    m.data      = document.getElementById('mat-data').value || '';
    m.fornecedor = (document.getElementById('mat-fornecedor').value || '').trim();
    m.descricao = (document.getElementById('mat-descricao').value || '').trim();
    salvar();
    materialEditandoId = null;
    render();
    toast('Material atualizado!');
  }

  function removerMaterial(id) {
    const obra = getObra(obraAtualId);
    if (!obra || !obra.materiais) return;
    const m = obra.materiais.find(function(x) { return x.id === id; });
    if (!m || !confirm('Remover "' + m.nome + '"?')) return;
    obra.materiais = obra.materiais.filter(function(x) { return x.id !== id; });
    salvar();
    render();
  }

  function gerarListaComprasPDF() {
    const obra = getObra(obraAtualId);
    if (!obra || !(obra.materiais || []).length) return;
    if (window.jspdf) { _gerarListaPDF(obra); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = function() { _gerarListaPDF(obra); };
    s.onerror = function() { alert('Erro ao carregar biblioteca de PDF. Verifique sua conexão.'); };
    document.head.appendChild(s);
  }

  function _gerarListaPDF(obra) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const PW = 210, ML = 14, MR = 196;
    let y = 0;

    doc.setFillColor(115, 1, 140);
    doc.rect(0, 0, PW, 24, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(14); doc.setFont('helvetica', 'bold');
    doc.text('AS CONSTRUCTION', ML, 10);
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('Lista de Compras — Uso Interno', ML, 17);
    doc.text(new Date().toLocaleDateString('pt-BR'), MR, 10, { align: 'right' });

    y = 32;
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(12); doc.setFont('helvetica', 'bold');
    doc.text(escapeHtml(obra.nome), ML, y);
    if (obra.cliente) { doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(100,100,100); doc.text(escapeHtml(obra.cliente), ML, y + 6); }
    y += 16;

    doc.setDrawColor(220, 220, 220);
    doc.setFillColor(245, 240, 250);
    doc.rect(ML, y, MR - ML, 8, 'F');
    doc.setFontSize(8); doc.setFont('helvetica', 'bold'); doc.setTextColor(80, 0, 100);
    doc.text('MATERIAL', ML + 2, y + 5.5);
    doc.text('QTD', 120, y + 5.5);
    doc.text('UN.', 138, y + 5.5);
    doc.text('VALOR UN.', 155, y + 5.5);
    doc.text('TOTAL', MR - 2, y + 5.5, { align: 'right' });
    y += 10;

    doc.setFont('helvetica', 'normal'); doc.setTextColor(0, 0, 0); doc.setFontSize(9);
    let totalGeral = 0;
    (obra.materiais || []).forEach(function(m) {
      var nomeLines = doc.splitTextToSize(m.nome, 100);
      var fornLines = m.fornecedor ? doc.splitTextToSize(m.fornecedor, 100) : [];
      var rowH = nomeLines.length * 5 + (fornLines.length > 0 ? fornLines.length * 4.5 + 1 : 0) + 3;
      if (y + rowH > 270) { doc.addPage(); y = 20; }
      const total = Number(m.quantidade||0) * Number(m.valorUnit||0);
      totalGeral += total;
      doc.text(nomeLines, ML + 2, y);
      doc.text(String(m.quantidade), 120, y);
      doc.text(m.unidade, 138, y);
      doc.text('R$ ' + m.valorUnit.toLocaleString('pt-BR', {minimumFractionDigits:2}), 155, y);
      doc.text('R$ ' + total.toLocaleString('pt-BR', {minimumFractionDigits:2}), MR - 2, y, { align: 'right' });
      if (fornLines.length > 0) {
        var fornY = y + nomeLines.length * 5;
        doc.setTextColor(130,130,130); doc.setFontSize(7.5);
        doc.text(fornLines, ML + 2, fornY);
        doc.setFontSize(9); doc.setTextColor(0,0,0);
      }
      y += rowH;
      doc.setDrawColor(235, 235, 235); doc.line(ML, y - 1, MR, y - 1);
    });

    y += 4;
    if (y > 270) { doc.addPage(); y = 20; }
    doc.setFillColor(115, 1, 140);
    doc.rect(ML, y, MR - ML, 9, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.text('TOTAL', ML + 2, y + 6.5);
    doc.text('R$ ' + totalGeral.toLocaleString('pt-BR', {minimumFractionDigits:2}), MR - 2, y + 6.5, { align: 'right' });

    const slug = (obra.nome || 'obra').toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g,'-');
    doc.save('lista-compras-' + slug + '.pdf');
  }

    salvar();
    toast('Salvo!');

  function adicionarFrenteTrabalho() {
    const obra = getObra(obraAtualId);
    if (!obra) return;
    const nomeEl = document.getElementById('frente-nome');
    const descEl = document.getElementById('frente-desc');
    const nome = nomeEl ? nomeEl.value.trim() : '';
    const desc = descEl ? descEl.value.trim() : '';
    if (!nome) { toast('Informe o nome da frente de trabalho.'); return; }
    if (!obra.info) obra.info = {};
    if (!obra.info.frentes) obra.info.frentes = [];
    obra.info.frentes.push({ id: 'frente_' + Date.now(), nome: nome, descricao: desc });
    salvar();
    abaAtual = 'info';
    render();
  }

  function removerFrente(btn) {
    const container = btn.closest('[data-id]');
    if (!container) return;
    const frenteId = container.getAttribute('data-id');
    const obra = getObra(obraAtualId);
    if (!obra || !obra.info) return;
    obra.info.frentes = (obra.info.frentes || []).filter(function(f) { return f.id !== frenteId; });
    salvar();
    abaAtual = 'info';
    render();
  }

  function gerarRelatorioCliente() {
    const obra = getObra(obraAtualId);
    if (!obra) return;
    function _doGerar(logoDataURL) {
      if (window.jspdf) { _gerarPDFCliente(obra, logoDataURL); return; }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = function() { _gerarPDFCliente(obra, logoDataURL); };
      s.onerror = function() { alert('Erro ao carregar biblioteca de PDF. Verifique sua conexão.'); };
      document.head.appendChild(s);
    }
    _fetchLogoDataURL(_doGerar);
  }

  function _fetchLogoDataURL(callback) {
    if (window._logoDataURL) { callback(window._logoDataURL); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      try {
        const cv = document.createElement('canvas');
        cv.width = img.width; cv.height = img.height;
        cv.getContext('2d').drawImage(img, 0, 0);
        window._logoDataURL = cv.toDataURL('image/png');
        callback(window._logoDataURL);
      } catch(e) { callback(null); }
    };
    img.onerror = function() { callback(null); };
    img.src = 'LOGO AS .png';
  }

  function _gerarPDFCliente(obra, logoDataURL) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const PW = 210, PH = 297, ML = 16, MR = 194;
    const info = obra.info || {};

    function addPageHeader() {
      doc.setFillColor(115, 1, 140);
      doc.rect(0, 0, PW, 14, 'F');
      doc.setTextColor(255,255,255); doc.setFontSize(8); doc.setFont('helvetica', 'bold');
      doc.text('AS CONSTRUCTION', ML, 9);
      doc.setFont('helvetica', 'normal');
      doc.text('Relatorio de Entrega de Obra', MR, 9, { align: 'right' });
    }

    function checkPage(y) {
      if (y > 268) { doc.addPage(); addPageHeader(); return 22; }
      return y;
    }

    function secTitle(y, txt) {
      y = checkPage(y);
      doc.setFillColor(245, 240, 250); doc.rect(ML, y, MR - ML, 7, 'F');
      doc.setTextColor(115, 1, 140); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
      doc.text(txt, ML + 3, y + 5);
      doc.setTextColor(0,0,0); doc.setFont('helvetica', 'normal');
      return y + 11;
    }

    function addField(y, label, value) {
      var valLines = doc.splitTextToSize(value || '', MR - ML - 50);
      var blockH = Math.max(7, valLines.length * 5.5);
      y = checkPage(y);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(100,100,100);
      doc.text(label, ML, y);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(30,30,30);
      doc.text(valLines, ML + 50, y);
      return y + blockH;
    }

    function addText(y, text, maxW) {
      const lines = doc.splitTextToSize(text || '', maxW || (MR - ML));
      lines.forEach(function(line) {
        y = checkPage(y);
        doc.setTextColor(30,30,30);
        doc.text(line, ML, y);
        y += 5.5;
      });
      return y;
    }

    // ── CAPA ──
    doc.setFillColor(115, 1, 140);
    doc.rect(0, 0, PW, 38, 'F');
    if (logoDataURL) {
      try { doc.addImage(logoDataURL, 'PNG', ML, 6, 44, 22); } catch(e) {}
    }
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('AS CONSTRUCTION', MR, 14, { align: 'right' });

    doc.setTextColor(30, 30, 30); doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    doc.text('RELATORIO DE ENTREGA DE OBRA', PW/2, 62, { align: 'center' });
    doc.setDrawColor(115,1,140); doc.line(ML, 65, MR, 65);

    // Nome do cliente (razao social ou campo cliente)
    const clienteNome = (info.clienteRazaoSocial || obra.cliente || 'Cliente').toUpperCase();
    doc.setFontSize(22); doc.setFont('helvetica', 'bold'); doc.setTextColor(20,20,20);
    const clienteLines = doc.splitTextToSize(clienteNome, MR - ML);
    let cy = 80;
    clienteLines.forEach(function(l) { doc.text(l, PW/2, cy, { align: 'center' }); cy += 10; });

    doc.setFontSize(14); doc.setFont('helvetica', 'normal'); doc.setTextColor(80,80,80);
    doc.text(obra.nome || '', PW/2, cy + 6, { align: 'center' });

    const dataEntrega = obra.dataPrevisao ? dateBR(obra.dataPrevisao) : new Date().toLocaleDateString('pt-BR');
    doc.setFontSize(10); doc.setTextColor(120,120,120);
    doc.text('Entregue em ' + dataEntrega, PW/2, cy + 16, { align: 'center' });

    doc.setFontSize(8); doc.setTextColor(180,180,180);
    doc.text('AS Construction  Pagina 1', PW/2, PH - 10, { align: 'center' });

    // ── CORPO ──
    doc.addPage();
    addPageHeader();
    let y = 22;

    // 1. Dados do Contrato
    y = secTitle(y, '1. DADOS DO CONTRATO');
    const razaoSocial = info.clienteRazaoSocial || obra.cliente || '';
    if (razaoSocial) y = addField(y, 'Cliente:', razaoSocial);
    if (info.clienteCpfCnpj) y = addField(y, 'CPF/CNPJ:', info.clienteCpfCnpj);
    if (info.clienteEndereco) y = addField(y, 'Endereco:', info.clienteEndereco);
    if (info.clienteContato || info.clienteTelefone) {
      const contato = [info.clienteContato, info.clienteTelefone].filter(Boolean).join('  ');
      y = addField(y, 'Contato:', contato);
    }
    if (obra.dataInicio || obra.dataPrevisao) {
      const periodo = (obra.dataInicio ? dateBR(obra.dataInicio) : '-') + '  ate  ' + (obra.dataPrevisao ? dateBR(obra.dataPrevisao) : '-');
      y = addField(y, 'Periodo:', periodo);
    }
    y = addField(y, 'Valor do contrato:', brl(obra.contrato || 0));
    y += 4;

    // 2. Cronograma
    if (obra.dataInicio || obra.dataPrevisao) {
      y = secTitle(y, '2. CRONOGRAMA EXECUTADO');
      const hoje = hojeISO();
      const previsto = obra.dataPrevisao || '';
      y = addField(y, 'Inicio:', obra.dataInicio ? dateBR(obra.dataInicio) : 'Nao informado');
      y = addField(y, 'Previsao de termino:', previsto ? dateBR(previsto) : 'Nao informado');
      if (previsto) {
        const entregaRef = obra.status === 'concluida' ? previsto : hoje;
        const diasDiff = Math.round((new Date(entregaRef + 'T12:00:00') - new Date(previsto + 'T12:00:00')) / 86400000);
        const indicador = diasDiff <= 0 ? 'Prazo cumprido' : 'Concluida com ' + diasDiff + ' dia(s) de atraso';
        y = checkPage(y); doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
        doc.setTextColor(diasDiff <= 0 ? 5 : 180, diasDiff <= 0 ? 150 : 50, diasDiff <= 0 ? 105 : 6);
        doc.text(indicador, ML, y); doc.setTextColor(0,0,0); doc.setFont('helvetica','normal');
        y += 8;
      }
      y += 4;
    }

    // 3. Escopo realizado
    const escopoText = info.escopoDetalhado || '';
    if (escopoText.trim()) {
      y = secTitle(y, '3. ESCOPO REALIZADO');
      doc.setFontSize(9);
      y = addText(y, escopoText.trim());
      y += 4;
    }

    // 4. Equipes de Execucao (apenas frentes de trabalho - NUNCA empreiteiros)
    const frentes = info.frentes || [];
    let secNum = escopoText.trim() ? 4 : 3;
    if (frentes.length > 0) {
      y = secTitle(y, secNum + '. EQUIPES DE EXECUCAO');
      doc.setFontSize(9);
      frentes.forEach(function(f) {
        y = checkPage(y);
        doc.setFont('helvetica', 'bold'); doc.setTextColor(30,30,30);
        doc.text(f.nome || '', ML + 2, y); y += 5.5;
        if (f.descricao) {
          doc.setFont('helvetica', 'normal'); doc.setTextColor(80,80,80);
          y = addText(y, f.descricao, MR - ML - 4);
        }
        y += 2;
      });
      y += 2;
      secNum++;
    }

    // 5. Materiais utilizados (sem valores)
    const mats = obra.materiais || [];
    if (mats.length > 0) {
      y = secTitle(y, secNum + '. MATERIAIS UTILIZADOS');
      doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(30,30,30);
      mats.forEach(function(m) {
        y = checkPage(y);
        doc.text(m.nome + '   ' + m.quantidade + ' ' + m.unidade, ML + 2, y);
        y += 5.5;
      });
      y += 4;
      secNum++;
    }

    // 6. Resumo financeiro do cliente
    y = secTitle(y, secNum + '. RESUMO FINANCEIRO');
    y = addField(y, 'Valor do contrato:', brl(obra.contrato || 0));
    const recbEfetuados = (obra.recebimentos || []).filter(function(r) { return r.previsto !== true; });
    if (recbEfetuados.length > 0) {
      y = checkPage(y); doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(100,100,100);
      doc.text('Recebimentos:', ML, y); y += 6;
      doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
      recbEfetuados.forEach(function(r) {
        y = checkPage(y);
        const label = (r.data ? dateBR(r.data) + '  ' : '') + (r.descricao || 'Recebimento');
        doc.text(label, ML + 4, y);
        doc.text(brl(r.valor || 0), MR, y, { align: 'right' });
        y += 5.5;
      });
      y += 2;
    } else {
      y = checkPage(y); doc.setTextColor(130,130,130); doc.setFontSize(8.5);
      doc.text('Nenhum recebimento registrado.', ML, y); doc.setTextColor(0,0,0);
      y += 7;
    }
    const c2 = calcularObra(obra);
    y = addField(y, 'Total recebido:', brl(c2.totalRecebido));
    const situacao = c2.saldoReceber <= 0 ? 'Quitado' : 'Saldo pendente: ' + brl(c2.saldoReceber);
    y = checkPage(y); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    doc.setTextColor(c2.saldoReceber <= 0 ? 5 : 180, c2.saldoReceber <= 0 ? 150 : 50, c2.saldoReceber <= 0 ? 105 : 6);
    doc.text(situacao, ML, y); doc.setTextColor(0,0,0); doc.setFont('helvetica','normal');
    y += 10;
    secNum++;

    // 7. Garantia
    const garantiaText = info.garantia || 'Os servicos realizados possuem garantia de 2 anos e 6 meses a partir da data de entrega da obra.';
    y = secTitle(y, secNum + '. GARANTIA');
    doc.setFontSize(9); doc.setFont('helvetica','normal');
    y = addText(y, garantiaText.trim());
    if (obra.dataPrevisao) {
      const dataEntrega2 = new Date(obra.dataPrevisao + 'T12:00:00');
      dataEntrega2.setMonth(dataEntrega2.getMonth() + 30);
      y = checkPage(y); doc.setTextColor(80,80,80); doc.setFontSize(8.5);
      doc.text('Validade estimada: ' + dataEntrega2.toLocaleDateString('pt-BR'), ML, y);
      doc.setTextColor(0,0,0);
      y += 8;
    }
    y += 2;
    secNum++;

    // 8. Encerramento
    const mensagemFinal = 'Foi uma honra atender voces. A AS Construction permanece a disposicao para futuras parcerias.';
    y = secTitle(y, secNum + '. ENCERRAMENTO');
    doc.setFontSize(9); doc.setFont('helvetica', 'italic');
    y = addText(y, '"' + mensagemFinal + '"');
    doc.setFont('helvetica', 'normal');
    y += 6;
    y = checkPage(y);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(115,1,140);
    doc.text('AS Construction', MR, y, { align: 'right' });

    // Rodape em todas as paginas
    const totalPag = doc.getNumberOfPages();
    for (let p = 1; p <= totalPag; p++) {
      doc.setPage(p);
      doc.setFillColor(245,240,250); doc.rect(0, PH - 12, PW, 12, 'F');
      doc.setTextColor(150,100,170); doc.setFontSize(7.5); doc.setFont('helvetica', 'normal');
      doc.text('AS Construction  Relatorio de Entrega de Obra  ' + new Date().toLocaleDateString('pt-BR'), PW/2, PH - 4, { align: 'center' });
    }

    const slug = (obra.nome || 'obra').toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g,'-');
    doc.save('relatorio-cliente-' + slug + '.pdf');
    toast('PDF gerado!');
  }


  // INIT - Pré-cadastra Atmosphera apenas se não houver nenhuma obra
  function abrirDrawer() {
    var el = document.getElementById('obra-drawer');
    var ov = document.getElementById('obra-overlay');
    if (el) el.classList.add('open');
    if (ov) ov.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function fecharDrawer() {
    var el = document.getElementById('obra-drawer');
    var ov = document.getElementById('obra-overlay');
    if (el) el.classList.remove('open');
    if (ov) ov.classList.remove('show');
    document.body.style.overflow = '';
  }

  function toggleSidebar() {
    if (window.innerWidth < 768) { abrirDrawer(); return; }
    var layout = document.getElementById('obra-layout-wrap');
    var sidebar = document.getElementById('obra-drawer');
    if (!layout || !sidebar) return;

    if (!layout.classList.contains('collapsed')) {
      // Fechar: fade out rápido → depois encolhe (invisível, sem barra branca)
      sidebar.style.transition = 'opacity 110ms ease';
      sidebar.style.opacity = '0';
      setTimeout(function() {
        layout.classList.add('collapsed');
        localStorage.setItem('sidebarCollapsed', '1');
        sidebar.style.transition = '';
        sidebar.style.opacity = '';
      }, 115);
    } else {
      // Abrir: expande largura → depois fade in
      layout.classList.remove('collapsed');
      sidebar.style.opacity = '0';
      sidebar.style.transition = 'none';
      void sidebar.offsetWidth; // força reflow
      setTimeout(function() {
        sidebar.style.transition = 'opacity 160ms ease';
        sidebar.style.opacity = '1';
        localStorage.setItem('sidebarCollapsed', '0');
        setTimeout(function() {
          sidebar.style.transition = '';
          sidebar.style.opacity = '';
        }, 170);
      }, 200);
    }
  }

  function trocarAbaMobile(aba) {
    if (window.innerWidth < 768) {
      fecharDrawer();
      setTimeout(function() { trocarAba(aba); }, 250);
    } else {
      trocarAba(aba);
    }
  }

  function renderAbaDiario(obra) {
    var diarios = (obra.diario || []);
    var hoje = hojeISO();
    var editando = diarioEditandoId ? diarios.find(function(d) { return d.id === diarioEditandoId; }) : null;

    var html = '<div class="two-col-layout">';

    // Col esquerda: formulário
    html += '<div><div class="card">';
    html += '<div class="card-title">' + (editando ? 'EDITAR REGISTRO' : 'NOVO REGISTRO') + '</div>';

    html += '<label class="form-label">Data *</label>';
    html += '<input type="date" id="diario-data" value="' + (editando ? editando.data : hoje) + '">';

    html += '<label class="form-label">Descrição *</label>';
    html += '<textarea id="diario-desc" rows="4" placeholder="Descreva as atividades realizadas...">' + escapeHtml(editando ? editando.descricao : '') + '</textarea>';

    html += '<label class="form-label">% de andamento <span style="color:var(--ink-3);font-weight:400;">(opcional)</span></label>';
    var pctVal = (editando && editando.percentual !== null && editando.percentual !== undefined) ? editando.percentual : '';
    html += '<input type="number" id="diario-pct" min="0" max="100" placeholder="Ex: 65" value="' + pctVal + '">';

    html += '<label class="form-label">Etapa / fase <span style="color:var(--ink-3);font-weight:400;">(opcional)</span></label>';
    html += '<input type="text" id="diario-etapa" placeholder="Ex: Impermeabilização" value="' + escapeHtml(editando ? (editando.etapa || '') : '') + '">';

    if (editando) {
      html += '<button class="btn-primary" onclick="salvarRegistroDiario()">Atualizar Registro</button>';
      html += '<button class="btn-secondary" onclick="cancelarEdicaoDiario()" style="margin-top:8px;">Cancelar</button>';
    } else {
      html += '<button class="btn-primary" onclick="salvarRegistroDiario()">Salvar Registro</button>';
    }
    html += '</div></div>';

    // Col direita: lista
    html += '<div><div class="card">';
    html += '<div class="card-title">REGISTROS (' + diarios.length + ')</div>';

    html += '<div style="display:flex;gap:8px;margin-bottom:10px;">';
    html += '<button class="rel-quinzena-pill' + (diarioQuinzena === 1 ? ' active' : '') + '" data-q="1" onclick="setDiarioQuinzena(1)">1ª Quinzena</button>';
    html += '<button class="rel-quinzena-pill' + (diarioQuinzena === 2 ? ' active' : '') + '" data-q="2" onclick="setDiarioQuinzena(2)">2ª Quinzena</button>';
    html += '</div>';

    html += '<input type="month" value="' + diarioMes + '" onchange="diarioMes=this.value;render();" style="width:100%;margin-bottom:14px;">';

    var parts = diarioMes.split('-');
    var ano = Number(parts[0]), mesNum = Number(parts[1]);
    var diaFim = diarioQuinzena === 1 ? 15 : new Date(ano, mesNum, 0).getDate();
    var isoInicio = diarioMes + '-' + (diarioQuinzena === 1 ? '01' : '16');
    var isoFim = diarioMes + '-' + String(diaFim).padStart(2, '0');
    var filtrados = diarios
      .filter(function(d) { return d.data >= isoInicio && d.data <= isoFim; })
      .sort(function(a, b) { return b.data.localeCompare(a.data); });

    if (filtrados.length === 0) {
      html += '<div style="color:var(--ink-3);font-size:14px;text-align:center;padding:20px 0;">Nenhum registro neste período.</div>';
    } else {
      filtrados.forEach(function(d) {
        html += '<div class="diario-item">';
        html += '<div class="diario-item-data">' + dateBR(d.data) + '</div>';
        html += '<div class="diario-item-desc">' + escapeHtml(d.descricao) + '</div>';
        if (d.percentual !== null && d.percentual !== undefined && d.percentual !== '') {
          html += '<span class="diario-badge">' + d.percentual + '%</span>';
        }
        if (d.etapa) {
          html += '<span class="diario-badge">' + escapeHtml(d.etapa) + '</span>';
        }
        html += '<div style="margin-top:8px;display:flex;gap:6px;">';
        html += '<button class="btn-secondary" style="padding:4px 10px;font-size:12px;width:auto;margin-top:0;" onclick="editarRegistroDiario(\'' + d.id + '\')">Editar</button>';
        html += '<button class="btn-secondary" style="padding:4px 10px;font-size:12px;width:auto;margin-top:0;color:var(--red);border-color:rgba(220,38,38,0.3);" onclick="removerRegistroDiario(\'' + d.id + '\')">×</button>';
        html += '</div>';
        html += '</div>';
      });
    }

    html += '<button class="btn-secondary" onclick="gerarPDFDiario()" style="margin-top:12px;font-size:13px;">Exportar PDF do Diário</button>';
    html += '</div></div>';

    html += '</div>';
    return html;
  }

  function salvarRegistroDiario() {
    var obra = getObra(obraAtualId);
    if (!obra) return;
    var data = document.getElementById('diario-data').value;
    var descricao = (document.getElementById('diario-desc').value || '').trim();
    var pctRaw = document.getElementById('diario-pct').value;
    var etapa = (document.getElementById('diario-etapa').value || '').trim();
    if (!data) { alert('Informe a data.'); return; }
    if (!descricao) { alert('A descrição é obrigatória.'); return; }
    var percentual = pctRaw !== '' ? Math.min(100, Math.max(0, Number(pctRaw))) : null;
    if (!obra.diario) obra.diario = [];
    if (diarioEditandoId) {
      var idx = obra.diario.findIndex(function(d) { return d.id === diarioEditandoId; });
      if (idx !== -1) {
        obra.diario[idx].data = data;
        obra.diario[idx].descricao = descricao;
        obra.diario[idx].percentual = percentual;
        obra.diario[idx].etapa = etapa;
      }
      diarioEditandoId = null;
      toast('Registro atualizado');
    } else {
      obra.diario.push({
        id: 'diario_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
        data: data, descricao: descricao, percentual: percentual, etapa: etapa,
        criadoEm: new Date().toISOString()
      });
      toast('Registro salvo');
    }
    salvar();
    render();
  }

  function removerRegistroDiario(id) {
    if (!confirm('Remover este registro do diário?')) return;
    var obra = getObra(obraAtualId);
    if (!obra) return;
    obra.diario = (obra.diario || []).filter(function(d) { return d.id !== id; });
    salvar(); render();
    toast('Registro removido');
  }

  function editarRegistroDiario(id) {
    diarioEditandoId = id;
    render();
    window.scrollTo(0, 0);
  }

  function cancelarEdicaoDiario() {
    diarioEditandoId = null;
    render();
  }

  function setDiarioQuinzena(q) {
    diarioQuinzena = q;
    render();
  }

  function gerarPDFDiario() {
    var obra = getObra(obraAtualId);
    if (!obra) return;
    if (window.jspdf) {
      _gerarPDFDiario(obra);
    } else {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = function() { _gerarPDFDiario(obra); };
      document.head.appendChild(s);
    }
  }

  function _gerarPDFDiario(obra) {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: 'mm', format: 'a4' });
    var PW = 210, PH = 297, ML = 16, MR = 16;
    var todayStr = new Date().toLocaleDateString('pt-BR');
    var nomeMes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    var partes = diarioMes.split('-');
    var anoNum = Number(partes[0]), mesIdx = Number(partes[1]) - 1;
    var periodoLabel = (diarioQuinzena === 1 ? '1ª Quinzena' : '2ª Quinzena') + ' — ' + nomeMes[mesIdx] + '/' + anoNum;
    var pageNum = 1;

    function headerPage(n) {
      doc.setFillColor(115, 1, 140);
      doc.rect(0, 0, PW, 28, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(255, 255, 255);
      doc.text('AS CONSTRUCTION', ML, 12);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text('Diário de Obra', ML, 19);
      doc.text('Pág. ' + n, PW - MR, 19, { align: 'right' });
    }

    headerPage(pageNum);
    var y = 36;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);
    doc.text('Obra:', ML, y);
    doc.setTextColor(20, 20, 20);
    doc.setFont('helvetica', 'bold');
    doc.text(obra.nome, ML + 16, y);
    y += 5;
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(100, 100, 100);
    doc.text('Cliente:', ML, y);
    doc.setTextColor(20, 20, 20);
    doc.text(obra.cliente || 'Não informado', ML + 16, y);
    y += 5;
    doc.setTextColor(100, 100, 100);
    doc.text('Período:', ML, y);
    doc.setTextColor(20, 20, 20);
    doc.text(periodoLabel, ML + 16, y);
    y += 7;

    doc.setDrawColor(200, 200, 200);
    doc.line(ML, y, PW - MR, y);
    y += 6;

    var diaFimFilt = diarioQuinzena === 1 ? 15 : new Date(anoNum, mesIdx + 1, 0).getDate();
    var isoInicioFilt = diarioMes + '-' + (diarioQuinzena === 1 ? '01' : '16');
    var isoFimFilt = diarioMes + '-' + String(diaFimFilt).padStart(2, '0');
    var registros = (obra.diario || [])
      .filter(function(d) { return d.data >= isoInicioFilt && d.data <= isoFimFilt; })
      .sort(function(a, b) { return b.data.localeCompare(a.data); });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(120, 120, 120);
    doc.text('DATA', ML, y);
    doc.text('DESCRIÇÃO', ML + 22, y);
    doc.text('%', ML + 140, y);
    doc.text('ETAPA', ML + 150, y);
    y += 4;
    doc.setDrawColor(200, 200, 200);
    doc.line(ML, y, PW - MR, y);
    y += 5;

    if (registros.length === 0) {
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(10);
      doc.setTextColor(150, 150, 150);
      doc.text('Nenhum registro neste período.', ML, y);
    } else {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      registros.forEach(function(d) {
        var descLines = doc.splitTextToSize(d.descricao, 112);
        var etapaLines = d.etapa ? doc.splitTextToSize(d.etapa, 38) : [];
        var lineH = Math.max(6, Math.max(descLines.length, etapaLines.length) * 5 + 2);
        if (y + lineH > PH - 20) {
          doc.setFontSize(8); doc.setTextColor(150, 150, 150);
          doc.text('Gerado em ' + todayStr + ' — AS Construction', PW / 2, PH - 8, { align: 'center' });
          doc.addPage();
          pageNum++;
          headerPage(pageNum);
          y = 36;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
        }
        doc.setTextColor(20, 20, 20);
        doc.text(dateBR(d.data), ML, y);
        doc.text(descLines, ML + 22, y);
        if (d.percentual !== null && d.percentual !== undefined && d.percentual !== '') {
          doc.setTextColor(115, 1, 140);
          doc.setFont('helvetica', 'bold');
          doc.text(String(d.percentual) + '%', ML + 140, y);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(20, 20, 20);
        }
        if (etapaLines.length > 0) {
          doc.text(etapaLines, ML + 150, y);
        }
        y += lineH;
        doc.setDrawColor(235, 235, 235);
        doc.line(ML, y, PW - MR, y);
        y += 3;
      });
    }

    doc.setFontSize(8); doc.setTextColor(150, 150, 150);
    doc.text('Gerado em ' + todayStr + ' — AS Construction', PW / 2, PH - 8, { align: 'center' });

    var slugObra = obra.nome.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 30);
    doc.save('diario-' + slugObra + '-' + diarioMes + '-Q' + diarioQuinzena + '.pdf');
  }

  function renderAbaLancamento(obra, c) {
    if (lancamentoEstado === 'carregando') {
      return '<div class="card" style="text-align:center;padding:40px 24px;">'
        + '<div class="chat-loading" style="justify-content:center;margin-bottom:12px;"><span></span><span></span><span></span></div>'
        + '<div style="color:var(--ink-3);font-size:14px;">Interpretando seu relato...</div>'
        + '</div>';
    }

    if (lancamentoEstado === 'gravado') {
      return _renderLancamentoGravado();
    }

    if (lancamentoEstado === 'revisao' && lancamentoRevisao) {
      return lancamentoModo === 'info' ? _renderInfoObraRevisao(obra) : _renderLancamentoRevisao(obra);
    }

    var placeholderDia  = 'Ex: Carlos e Emerson trabalharam com marmita. Comprei 80 reais de impermeabilização. Removemos 100% do rejunte das piscinas.';
    var placeholderInfo = 'Ex: Cliente é o Complexo Atmosphera, CNPJ 12.345.678/0001-90, fica em Itupeva. O escopo é impermeabilização de 4 piscinas, sauna e iluminação. Equipe de impermeabilização cuidou das piscinas. Garantia de 5 anos.';
    return '<div class="card">'
      + '<div class="card-title">LANÇAMENTO RÁPIDO — IA</div>'
      + '<div style="display:flex;gap:8px;margin-bottom:14px;">'
      + '<button class="rel-quinzena-pill' + (lancamentoModo === 'dia' ? ' active' : '') + '" data-modo="dia" onclick="setLancamentoModo(\'dia\')" style="font-size:12px;">📅 Lançamento do dia</button>'
      + '<button class="rel-quinzena-pill' + (lancamentoModo === 'info' ? ' active' : '') + '" data-modo="info" onclick="setLancamentoModo(\'info\')" style="font-size:12px;">📋 Informações da Obra</button>'
      + '</div>'
      + '<p style="font-size:13px;color:var(--ink-3);margin-bottom:10px;">'
      + (lancamentoModo === 'info'
          ? 'Descreva os dados cadastrais da obra. A IA extrai e preenche a aba Informações — você revisa antes de confirmar.'
          : 'Descreva o dia em texto livre. A IA interpreta e mostra o que vai lançar — você confirma antes de gravar.')
      + '</p>'
      + '<textarea id="lanc-input" rows="5" placeholder="' + (lancamentoModo === 'info' ? placeholderInfo : placeholderDia) + '" style="width:100%;">' + escapeHtml(lancamentoTexto) + '</textarea>'
      + '<button class="btn-primary" onclick="interpretarLancamento()">Interpretar →</button>'
      + '<button class="btn-secondary" onclick="lancamentoTexto=\'\';var el=document.getElementById(\'lanc-input\');if(el)el.value=\'\';" style="margin-top:8px;">Limpar</button>'
      + '<p style="font-size:11px;color:var(--ink-3);margin-top:10px;text-align:center;">A IA nunca grava sem sua confirmação.</p>'

  function _renderLancamentoRevisao(obra) {
    var rev = lancamentoRevisao;
    var html = '<div class="card">';
    html += '<div class="card-title">REVISE ANTES DE LANÇAR</div>';
    html += '<p style="font-size:13px;color:var(--ink-3);margin-bottom:16px;">Desmarque itens que não quiser. Edite valores se necessário.</p>';

    if (rev.diarias && rev.diarias.length > 0) {
      html += '<div class="lanc-secao"><div class="lanc-secao-titulo">Diárias (' + rev.diarias.length + ')</div>';

        if (d.incluir) totalIncluidos++;

        html += '<div class="lanc-item-fields">';
        html += '<input type="date" value="' + (d.data || hojeISO()) + '" oninput="setLancItemField(\'diarias\',' + i + ',\'data\',this.value)">';
        html += '<select oninput="setLancItemField(\'diarias\',' + i + ',\'periodo\',this.value)">';
        html += '<option value="completo"' + (d.periodo !== 'meio' ? ' selected' : '') + '>Completo</option>';
        html += '<option value="meio"' + (d.periodo === 'meio' ? ' selected' : '') + '>Meio período</option>';
        html += '</select>';
        html += '<label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);"><input type="checkbox" ' + (d.marmita ? 'checked' : '') + ' onchange="setLancItemField(\'diarias\',' + i + ',\'marmita\',this.checked)"> Marmita</label>';
        html += '</div></div></div>';
      });
      html += '</div>';
    }

    if (rev.avulsos && rev.avulsos.length > 0) {
      html += '<div class="lanc-secao"><div class="lanc-secao-titulo">Gastos Avulsos (' + rev.avulsos.length + ')</div>';
      rev.avulsos.forEach(function(a, i) {
        if (a.incluir) totalIncluidos++;
        html += '<div class="lanc-item' + (a.incluir ? '' : ' desmarcado') + '" id="lanc-item-avulsos-' + i + '">';
        html += '<input type="checkbox" class="lanc-item-check" ' + (a.incluir ? 'checked' : '') + ' onchange="toggleLancItem(\'avulsos\',' + i + ',this.checked)">';
        html += '<div class="lanc-item-body">';
        html += '<div class="lanc-item-label">' + escapeHtml(a.descricao || a.categoria || 'Gasto') + (a.incerto ? ' <span style="color:var(--amber);font-size:11px;">⚠ incerto</span>' : '') + '</div>';
        html += '<div class="lanc-item-sub">' + dateBR(a.data) + ' · ' + brl(a.valor) + '</div>';
        html += '<div class="lanc-item-fields">';
        html += '<select oninput="setLancItemField(\'avulsos\',' + i + ',\'categoria\',this.value)">';
        ['combustivel','alimentacao','material','ferramenta','transporte','outros'].forEach(function(cat) {
          html += '<option value="' + cat + '"' + (a.categoria === cat ? ' selected' : '') + '>' + getCategoriaNome(cat) + '</option>';
        });
        html += '</select>';
        html += '<input type="text" value="' + escapeHtml(a.descricao || '') + '" placeholder="Descrição" oninput="setLancItemField(\'avulsos\',' + i + ',\'descricao\',this.value)" style="flex:1;">';
        html += '<input type="number" value="' + Number(a.valor || 0).toFixed(2) + '" min="0" step="0.01" oninput="setLancItemField(\'avulsos\',' + i + ',\'valor\',parseFloat(this.value)||0)" style="width:80px;">';
        html += '</div></div></div>';
      });
      html += '</div>';
    }

    if (rev.materiais && rev.materiais.length > 0) {
      html += '<div class="lanc-secao"><div class="lanc-secao-titulo">Materiais (' + rev.materiais.length + ')</div>';
      rev.materiais.forEach(function(m, i) {
        if (m.incluir) totalIncluidos++;
        var qtdVazio = !m.quantidade || Number(m.quantidade) <= 0;
        var unVazio = !m.unidade || m.unidade.trim() === '';
        var valVazio = !m.valorUnit || Number(m.valorUnit) <= 0;
        var incompleto = m.incluir && (qtdVazio || unVazio || valVazio);
        html += '<div class="lanc-item' + (m.incluir ? '' : ' desmarcado') + '" id="lanc-item-materiais-' + i + '">';
        html += '<input type="checkbox" class="lanc-item-check" ' + (m.incluir ? 'checked' : '') + ' onchange="toggleLancItem(\'materiais\',' + i + ',this.checked)">';
        html += '<div class="lanc-item-body">';

        html += '<div class="lanc-item-sub">' + subQtd + ' ' + subUn + ' × ' + brl(m.valorUnit) + '</div>';
        html += '<div class="lanc-item-fields">';
