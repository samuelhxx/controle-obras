        html += '<input type="number" value="' + (qtdVazio ? '' : m.quantidade) + '" min="0" placeholder="Qtd" oninput="setLancItemField(\'materiais\',' + i + ',\'quantidade\',parseFloat(this.value)||0)" style="width:55px;' + (qtdVazio ? 'border-color:var(--amber);' : '') + '">';
        html += '<input type="text" value="' + escapeHtml(m.unidade || '') + '" placeholder="Un" oninput="setLancItemField(\'materiais\',' + i + ',\'unidade\',this.value)" style="width:45px;' + (unVazio ? 'border-color:var(--amber);' : '') + '">';
        html += '<input type="number" value="' + (valVazio ? '' : Number(m.valorUnit).toFixed(2)) + '" min="0" step="0.01" placeholder="R$" oninput="setLancItemField(\'materiais\',' + i + ',\'valorUnit\',parseFloat(this.value)||0)" style="width:75px;' + (valVazio ? 'border-color:var(--amber);' : '') + '">';
        html += '</div>';
        if (incompleto) {
          var faltam = [];
          if (qtdVazio) faltam.push('quantidade');
          if (unVazio) faltam.push('unidade');
          if (valVazio) faltam.push('valor');
          html += '<div style="font-size:11px;color:var(--amber);margin-top:5px;">⚠ Preencha ' + faltam.join(' e ') + ' para confirmar este item</div>';
        }
        html += '</div></div>';
      });
      html += '</div>';
    }

    if (rev.diario && rev.diario.length > 0) {
      html += '<div class="lanc-secao"><div class="lanc-secao-titulo">Diário de Obra (' + rev.diario.length + ')</div>';
      rev.diario.forEach(function(d, i) {
        if (d.incluir) totalIncluidos++;
        html += '<div class="lanc-item' + (d.incluir ? '' : ' desmarcado') + '" id="lanc-item-diario-' + i + '">';
        html += '<input type="checkbox" class="lanc-item-check" ' + (d.incluir ? 'checked' : '') + ' onchange="toggleLancItem(\'diario\',' + i + ',this.checked)">';
        html += '<div class="lanc-item-body">';
        html += '<div class="lanc-item-label">' + dateBR(d.data) + (d.percentual !== null && d.percentual !== undefined ? ' · ' + d.percentual + '%' : '') + (d.etapa ? ' · ' + escapeHtml(d.etapa) : '') + (d.incerto ? ' <span style="color:var(--amber);font-size:11px;">⚠ incerto</span>' : '') + '</div>';
        html += '<div class="lanc-item-sub">' + escapeHtml(d.descricao) + '</div>';
        html += '<div class="lanc-item-fields">';
        html += '<input type="text" value="' + escapeHtml(d.descricao) + '" placeholder="Descrição" oninput="setLancItemField(\'diario\',' + i + ',\'descricao\',this.value)" style="flex:1;">';
        var pctV = (d.percentual !== undefined && d.percentual !== null) ? d.percentual : '';
        html += '<input type="number" value="' + pctV + '" min="0" max="100" placeholder="%" oninput="setLancItemField(\'diario\',' + i + ',\'percentual\',this.value===\'\'?null:Number(this.value))" style="width:50px;">';
        html += '<input type="text" value="' + escapeHtml(d.etapa || '') + '" placeholder="Etapa" oninput="setLancItemField(\'diario\',' + i + ',\'etapa\',this.value)" style="width:90px;">';
        html += '</div></div></div>';
      });
      html += '</div>';
    }

    if (rev.recebimentos && rev.recebimentos.length > 0) {
      html += '<div class="lanc-secao"><div class="lanc-secao-titulo">Recebimentos (' + rev.recebimentos.length + ')</div>';
      rev.recebimentos.forEach(function(r, i) {
        if (r.incluir) totalIncluidos++;
        html += '<div class="lanc-item' + (r.incluir ? '' : ' desmarcado') + '" id="lanc-item-recebimentos-' + i + '">';
        html += '<input type="checkbox" class="lanc-item-check" ' + (r.incluir ? 'checked' : '') + ' onchange="toggleLancItem(\'recebimentos\',' + i + ',this.checked)">';
        html += '<div class="lanc-item-body">';
        html += '<div class="lanc-item-label">' + escapeHtml(r.descricao || 'Recebimento') + (r.incerto ? ' <span style="color:var(--amber);font-size:11px;">⚠ incerto</span>' : '') + '</div>';
        html += '<div class="lanc-item-sub">' + dateBR(r.data) + ' · ' + brl(r.valor) + '</div>';
        html += '<div class="lanc-item-fields">';
        html += '<input type="text" value="' + escapeHtml(r.descricao || '') + '" placeholder="Descrição" oninput="setLancItemField(\'recebimentos\',' + i + ',\'descricao\',this.value)" style="flex:1;">';
        html += '<input type="number" value="' + Number(r.valor || 0).toFixed(2) + '" min="0" step="0.01" oninput="setLancItemField(\'recebimentos\',' + i + ',\'valor\',parseFloat(this.value)||0)" style="width:90px;">';
        html += '</div></div></div>';
      });
      html += '</div>';
    }

    if (rev.adiantamentos && rev.adiantamentos.length > 0) {
      html += '<div class="lanc-secao"><div class="lanc-secao-titulo">Adiantamentos (' + rev.adiantamentos.length + ')</div>';
      rev.adiantamentos.forEach(function(a, i) {
        if (a.incluir) totalIncluidos++;
        html += '<div class="lanc-item' + (a.incluir ? '' : ' desmarcado') + '" id="lanc-item-adiantamentos-' + i + '">';
        html += '<input type="checkbox" class="lanc-item-check" ' + (a.incluir ? 'checked' : '') + ' onchange="toggleLancItem(\'adiantamentos\',' + i + ',this.checked)">';
        html += '<div class="lanc-item-body">';
        html += '<div class="lanc-item-label">' + escapeHtml(a.empreitadaNome || 'Empreiteiro') + (a.incerto ? ' <span style="color:var(--amber);font-size:11px;">⚠ incerto</span>' : '') + '</div>';
        html += '<div class="lanc-item-sub">' + dateBR(a.data) + ' · ' + brl(a.valor) + '</div>';
        html += '<div class="lanc-item-fields">';
        html += '<input type="text" value="' + escapeHtml(a.descricao || 'Adiantamento') + '" placeholder="Descrição" oninput="setLancItemField(\'adiantamentos\',' + i + ',\'descricao\',this.value)" style="flex:1;">';
        html += '<input type="number" value="' + Number(a.valor || 0).toFixed(2) + '" min="0" step="0.01" oninput="setLancItemField(\'adiantamentos\',' + i + ',\'valor\',parseFloat(this.value)||0)" style="width:90px;">';
        html += '</div></div></div>';
      });
      html += '</div>';
    }

    if (rev.incertos && rev.incertos.length > 0) {
      html += '<div class="lanc-secao"><div class="lanc-secao-titulo">Itens incertos — não serão lançados</div>';
      rev.incertos.forEach(function(txt) {
        html += '<div class="lanc-incerto">' + escapeHtml(String(txt)) + '</div>';
      });
      html += '</div>';
    }

    if (totalIncluidos === 0 && (!rev.diarias || !rev.diarias.length) && (!rev.avulsos || !rev.avulsos.length) && (!rev.materiais || !rev.materiais.length) && (!rev.diario || !rev.diario.length) && (!rev.recebimentos || !rev.recebimentos.length) && (!rev.adiantamentos || !rev.adiantamentos.length)) {
      html += '<div style="color:var(--ink-3);text-align:center;padding:16px;font-size:14px;">Nenhum item interpretado no relato.</div>';
    }

    html += '<div style="border-top:1px solid rgba(0,0,0,0.06);margin-top:16px;padding-top:14px;display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<button class="btn-primary" onclick="confirmarLancamento()" style="flex:1;margin-top:0;">Confirmar e Lançar (' + totalIncluidos + ' itens)</button>';
    html += '<button class="btn-secondary" onclick="cancelarLancamento()" style="width:auto;margin-top:0;">Cancelar</button>';
    html += '</div>';
    html += '</div>';
    return html;
  }

  function _renderLancamentoGravado() {
    var rev = lancamentoRevisao || {};
    if (rev.infoModo) {
      var cCampos = Object.keys(rev.campos || {}).filter(function(k) { return rev.campos[k].incluir; }).length;
      var cFrentes = (rev.frentes || []).filter(function(f) { return f.incluir; }).length;
      var contsInfo = [];
      if (cCampos) contsInfo.push(cCampos + ' campo' + (cCampos > 1 ? 's' : '') + ' preenchido' + (cCampos > 1 ? 's' : ''));
      if (cFrentes) contsInfo.push(cFrentes + ' frente' + (cFrentes > 1 ? 's' : '') + ' adicionada' + (cFrentes > 1 ? 's' : ''));
      return '<div class="card" style="text-align:center;padding:32px 24px;">'
        + '<div style="font-size:18px;font-weight:700;color:var(--purple);margin-bottom:10px;">Informações salvas!</div>'
        + (contsInfo.length > 0 ? '<div style="font-size:14px;color:var(--ink-2);margin-bottom:20px;">' + contsInfo.join(' · ') + '</div>' : '')
        + '<button class="btn-primary" onclick="trocarAba(\'info\')" style="margin-bottom:8px;">Ver Informações da Obra</button>'
        + '<button class="btn-secondary" onclick="novoLancamento()">Novo Lançamento</button>'
        + '</div>';
    }
    var conts = [];
    var d = (rev.diarias || []).filter(function(x){ return x.incluir; }).length;
    var a = (rev.avulsos || []).filter(function(x){ return x.incluir; }).length;
    var m = (rev.materiais || []).filter(function(x){ return x.incluir; }).length;
    var di = (rev.diario || []).filter(function(x){ return x.incluir; }).length;
    var r = (rev.recebimentos || []).filter(function(x){ return x.incluir; }).length;
    var ad = (rev.adiantamentos || []).filter(function(x){ return x.incluir; }).length;
    if (d) conts.push(d + ' diária' + (d > 1 ? 's' : ''));
    if (a) conts.push(a + ' gasto' + (a > 1 ? 's' : ''));
    if (m) conts.push(m + ' material' + (m > 1 ? 'is' : ''));
    if (di) conts.push(di + ' registro' + (di > 1 ? 's no diário' : ' no diário'));
    if (r) conts.push(r + ' recebimento' + (r > 1 ? 's' : ''));
    if (ad) conts.push(ad + ' adiantamento' + (ad > 1 ? 's' : ''));
    return '<div class="card" style="text-align:center;padding:32px 24px;">'
      + '<div style="font-size:18px;font-weight:700;color:var(--purple);margin-bottom:10px;">Lançado com sucesso!</div>'
      + (conts.length > 0 ? '<div style="font-size:14px;color:var(--ink-2);margin-bottom:20px;">' + conts.join(', ') + '</div>' : '')
      + '<button class="btn-primary" onclick="trocarAba(\'resumo\')" style="margin-bottom:8px;">Ver Resumo</button>'
      + '<button class="btn-secondary" onclick="novoLancamento()">Novo Lançamento</button>'
      + '</div>';
  }

  async function interpretarLancamento() {
    if (lancamentoModo === 'info') { interpretarInfoObra(); return; }

    var textarea = document.getElementById('lanc-input');
    var texto = textarea ? textarea.value.trim() : '';
    if (!texto) { alert('Digite um relato antes de interpretar.'); return; }
    lancamentoTexto = texto;

    var apiKey = localStorage.getItem(KEY_IA);
    if (!apiKey) { abrirModalChaveIA(); return; }

    if (!window._anthropicSend) {
      alert('SDK ainda carregando — aguarde e tente novamente.'); return;
    }

    var obra = getObra(obraAtualId);
    if (!obra) return;
    var c = calcularObra(obra);

    var trabCtx = (obra.trabalhadores || []).length > 0
      ? obra.trabalhadores.map(function(t) { return t.id + ' | ' + t.nome + ' | R$' + t.diaria + '/dia'; }).join('\n')
      : 'Nenhum trabalhador cadastrado.';

    var empCtx = (obra.empreitadas || []).length > 0
      ? obra.empreitadas.map(function(e) { return e.id + ' | ' + e.nome; }).join('\n')
      : 'Nenhuma empreitada cadastrada.';

    var system = 'Você é um assistente de lançamento para o app AS Construction.\n'
      + 'Interprete o relato do dia em linguagem natural e retorne APENAS JSON válido (sem markdown, sem comentários).\n\n'
      + 'REGRAS:\n'
      + '1. Nunca invente valores não mencionados. Se ambíguo → "incerto":true + nota em "incertos".\n'
      + '2. Nomes de trabalhadores → mapear para os cadastrados abaixo (busca aproximada por nome). Se não encontrar, "incerto":true.\n'
      + '3. MATERIAL vs AVULSO — regra prioritária:\n'
      + '   a. Insumo/material de obra (cimento, argamassa, rejunte, tinta, areia, brita, pedra, tubo, conduíte, impermeabilizante, manta, viaplus, azulejo, cerâmica, madeira, ferragem, cola, solvente, EPI, ou qualquer coisa descrita como "material de ...") → SEMPRE em "materiais", mesmo sem quantidade informada. Nesse caso: quantidade:0, unidade:"", incerto:true.\n'
      + '   b. Despesa operacional (combustível, gasolina, alimentação, almoço, lanche, marmita avulsa, transporte, uber, estacionamento, pedágio, aluguel, taxa, serviço pontual) → "avulsos".\n'
      + '   c. Dúvida entre material e avulso → usar "materiais" com incerto:true.\n'
      + '4. Execução ou serviço realizado → "diario".\n'
      + '5. Categorias de gasto AVULSO (somente despesas operacionais, NUNCA materiais de obra): combustivel|alimentacao|ferramenta|transporte|outros.\n'
      + '6. "meio período" ou "meio dia" → periodo:"meio". Padrão → "completo".\n'
      + '7. Adiantamento a empreiteiro → "adiantamentos" com empreitadaId se mapeável.\n\n'
      + 'CONTEXTO DA OBRA:\n' + gerarContextoObra(obra, c) + '\n\n'
      + 'TRABALHADORES CADASTRADOS:\n' + trabCtx + '\n\n'
      + 'EMPREITADAS CADASTRADAS:\n' + empCtx + '\n\n'
      + 'VALOR MARMITA: R$ ' + (obra.valorMarmita || 30) + '\n'
      + 'DATA HOJE: ' + hojeISO() + '\n\n'
      + 'FORMATO DE RETORNO (JSON exato, sem markdown, sem texto adicional):\n'
      + '{"diarias":[{"trabId":"","trabNome":"","data":"YYYY-MM-DD","periodo":"completo","marmita":false,"diaria":0,"incerto":false}],'
      + '"avulsos":[{"categoria":"combustivel","descricao":"","valor":0,"data":"YYYY-MM-DD","incerto":false}],'
      + '"materiais":[{"nome":"","quantidade":0,"unidade":"","valorUnit":0,"data":"YYYY-MM-DD","incerto":false}],'
      + '"diario":[{"data":"YYYY-MM-DD","descricao":"","percentual":null,"etapa":"","incerto":false}],'
      + '"recebimentos":[{"descricao":"","valor":0,"data":"YYYY-MM-DD","incerto":false}],'
      + '"adiantamentos":[{"empreitadaId":"","empreitadaNome":"","descricao":"","valor":0,"data":"YYYY-MM-DD","incerto":false}],'
      + '"incertos":["texto explicativo"]}';

    lancamentoEstado = 'carregando';
    render();

    try {
      var resposta = await window._anthropicSend(apiKey, system, [{ role: 'user', content: texto }]);
      var jsonStr = resposta.trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/,'').trim();
      var parsed = JSON.parse(jsonStr);
      ['diarias','avulsos','materiais','diario','recebimentos','adiantamentos'].forEach(function(t) {
        if (!Array.isArray(parsed[t])) parsed[t] = [];
        parsed[t].forEach(function(item) { item.incluir = true; });
      });
      if (!Array.isArray(parsed.incertos)) parsed.incertos = [];
      lancamentoRevisao = parsed;
      lancamentoEstado = 'revisao';
      render();
    } catch(e) {
      console.error('Erro ao interpretar lançamento:', e);
      lancamentoEstado = 'entrada';
      render();
      toast('Erro ao interpretar. Verifique sua chave de API e tente novamente.');
    }
  }

  function toggleLancItem(tipo, idx, checked) {
    if (!lancamentoRevisao || !lancamentoRevisao[tipo]) return;
    lancamentoRevisao[tipo][idx].incluir = checked;
    var el = document.getElementById('lanc-item-' + tipo + '-' + idx);
    if (el) el.classList.toggle('desmarcado', !checked);
  }

  function setLancItemField(tipo, idx, campo, valor) {
    if (!lancamentoRevisao || !lancamentoRevisao[tipo]) return;
    lancamentoRevisao[tipo][idx][campo] = valor;
  }

  function confirmarLancamento() {
    var obra = getObra(obraAtualId);
    if (!obra || !lancamentoRevisao) return;
    var rev = lancamentoRevisao;
    var hoje = hojeISO();
    var totalGravado = 0;

    if (!obra.diarias) obra.diarias = [];
    (rev.diarias || []).forEach(function(d) {
      if (!d.incluir) return;
      var valorDiaria = Number(d.diaria) || 0;
      var valorMarmita = Number(obra.valorMarmita || 30);
      var diariaBase = d.periodo === 'meio' ? valorDiaria / 2 : valorDiaria;
      obra.diarias.push({
        id: 'd_' + Date.now() + '_' + (d.trabId || 'x') + '_' + Math.random().toString(36).slice(2,6),
        data: d.data || hoje, trabId: d.trabId || '', trabNome: d.trabNome || '',
        diaria: valorDiaria, marmita: !!d.marmita, periodo: d.periodo || 'completo',
        valor: diariaBase + (d.marmita ? valorMarmita : 0)
      });
      totalGravado++;
    });

    if (!obra.gastosAvulsos) obra.gastosAvulsos = [];
    (rev.avulsos || []).forEach(function(a) {
      if (!a.incluir) return;
      var val = Number(a.valor);
      if (val <= 0) return;
      obra.gastosAvulsos.push({
        id: 'av_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        data: a.data || hoje, categoria: a.categoria || 'outros',
        descricao: a.descricao || '', valor: val
      });
      totalGravado++;
    });

    if (!obra.materiais) obra.materiais = [];
    var materiaisIncompletos = (rev.materiais || []).filter(function(m) {
      if (!m.incluir || !m.nome) return false;
      var qtd = Number(m.quantidade) || 0;
      var vUnit = Number(m.valorUnit) || 0;
      return qtd <= 0 || vUnit <= 0;
    });
    if (materiaisIncompletos.length > 0) {
      var lista = materiaisIncompletos.map(function(m) { return '"' + m.nome + '"'; }).join(', ');
      var prosseguir = confirm(
        'Os seguintes materiais estão incompletos e NÃO serão gravados:\n' + lista + '\n\n' +
        'Deseja confirmar os demais itens mesmo assim?\n(Cancele para voltar e preencher os campos em âmbar.)'
      );
      if (!prosseguir) return;
    }
    (rev.materiais || []).forEach(function(m) {
      if (!m.incluir) return;
      var qtd = Number(m.quantidade) || 0;
      var vUnit = Number(m.valorUnit) || 0;
      if (!m.nome || qtd <= 0 || vUnit <= 0) return;
      obra.materiais.push({
        id: 'mat_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        nome: m.nome, quantidade: qtd, unidade: m.unidade || 'un',
        valorUnit: vUnit, data: m.data || hoje, fornecedor: '', descricao: '',
        criadoEm: new Date().toISOString()
      });
      totalGravado++;
    });

    if (!obra.diario) obra.diario = [];
    (rev.diario || []).forEach(function(d) {
      if (!d.incluir || !d.descricao) return;
      obra.diario.push({
        id: 'diario_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
        data: d.data || hoje, descricao: d.descricao,
        percentual: (d.percentual !== undefined && d.percentual !== null) ? Number(d.percentual) : null,
        etapa: d.etapa || '', criadoEm: new Date().toISOString()
      });
      totalGravado++;
    });

    if (!obra.recebimentos) obra.recebimentos = [];
    (rev.recebimentos || []).forEach(function(r) {
      if (!r.incluir) return;
      var val = Number(r.valor);
      if (val <= 0) return;
      obra.recebimentos.push({
        id: 'rc_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        data: r.data || hoje, descricao: r.descricao || 'Recebimento', valor: val
      });
      totalGravado++;
    });

    (rev.adiantamentos || []).forEach(function(a) {
      if (!a.incluir || !a.empreitadaId) return;
      var val = Number(a.valor);
      if (val <= 0) return;
      var emp = (obra.empreitadas || []).find(function(e) { return e.id === a.empreitadaId; });
      if (!emp) return;
      if (!emp.adiantamentos) emp.adiantamentos = [];
      emp.adiantamentos.push({
        id: 'ad_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        data: a.data || hoje, descricao: a.descricao || 'Adiantamento', valor: val
      });
      totalGravado++;
    });

    salvar();
    lancamentoEstado = 'gravado';
    toast(totalGravado + ' item' + (totalGravado !== 1 ? 'ns' : '') + ' lançado' + (totalGravado !== 1 ? 's' : '') + '!');
    render();
  }

  function cancelarLancamento() {
    lancamentoEstado = 'entrada';
    lancamentoRevisao = null;
    render();
  }

  function novoLancamento() {
    lancamentoEstado = 'entrada';
    lancamentoRevisao = null;
    lancamentoTexto = '';
    render();
  }

  // ═══════════════════════════════════════════════════════════
  // ASSISTENTE IA — MODO INFORMAÇÕES DA OBRA
  // ═══════════════════════════════════════════════════════════

  function setLancamentoModo(modo) {
    lancamentoModo = modo;
    document.querySelectorAll('.rel-quinzena-pill[data-modo]').forEach(function(p) {
      p.classList.toggle('active', p.dataset.modo === modo);
    });
    var el = document.getElementById('lanc-input');
    if (!el) return;

  async function interpretarInfoObra() {
    var textarea = document.getElementById('lanc-input');
    var texto = textarea ? textarea.value.trim() : '';
    if (!texto) { alert('Digite as informações antes de interpretar.'); return; }
    lancamentoTexto = texto;

    var apiKey = localStorage.getItem(KEY_IA);
    if (!apiKey) { abrirModalChaveIA(); return; }
    if (!window._anthropicSend) { alert('SDK ainda carregando — aguarde e tente novamente.'); return; }

    var obra = getObra(obraAtualId);
    if (!obra) return;
    var info = obra.info || {};
    var frentesExistentes = (info.frentes || []).length > 0
      ? (info.frentes.map(function(f) { return '- ' + f.nome + (f.descricao ? ': ' + f.descricao : ''); }).join('\n'))
      : 'Nenhuma frente cadastrada.';

    var camposAtuais = '';
    var CAMPO_LABELS = {
      clienteRazaoSocial: 'Razão Social / Nome',
      clienteCpfCnpj:     'CPF / CNPJ',
      clienteEndereco:    'Endereço',
      clienteContato:     'Contato / Responsável',
      clienteTelefone:    'Telefone',
      clienteEmail:       'E-mail',
      escopoDetalhado:    'Escopo detalhado',
      garantia:           'Garantia'
    };
    Object.keys(CAMPO_LABELS).forEach(function(k) {
      var val = info[k] || '';
      camposAtuais += '- ' + CAMPO_LABELS[k] + ': ' + (val ? '"' + val.substring(0, 80) + '"' : '(vazio)') + '\n';
    });

    var system = 'Você é um assistente de cadastro para o app AS Construction.\n'
      + 'Interprete a descrição em linguagem natural e extraia informações cadastrais da obra.\n'
      + 'Retorne APENAS JSON válido (sem markdown, sem comentários).\n\n'
      + 'OBRA: ' + obra.nome + '\n\n'
      + 'CAMPOS JÁ PREENCHIDOS (retorne null para campos que não foram mencionados no texto, mesmo que já estejam preenchidos):\n'
      + camposAtuais + '\n'
      + 'FRENTES DE TRABALHO JÁ CADASTRADAS:\n' + frentesExistentes + '\n\n'
      + 'REGRAS:\n'
      + '1. Retorne null nos campos não mencionados no texto — não invente.\n'
      + '2. Frentes mencionadas → incluir em "frentes" para serem ADICIONADAS à lista (não substituem as existentes).\n'
      + '3. Não adicione frentes já cadastradas com o mesmo nome.\n'
      + '4. Formate CNPJ como XX.XXX.XXX/XXXX-XX e CPF como XXX.XXX.XXX-XX quando possível.\n'
      + '5. Se um dado for ambíguo ou incerto → incerto:true no campo correspondente + nota em "incertos".\n'
      + '6. Garantia: extraia apenas o texto/prazo mencionado.\n\n'
      + 'FORMATO DE RETORNO:\n'
      + '{"campos":{"clienteRazaoSocial":"valor ou null","clienteCpfCnpj":"valor ou null","clienteEndereco":"valor ou null","clienteContato":"valor ou null","clienteTelefone":"valor ou null","clienteEmail":"valor ou null","escopoDetalhado":"valor ou null","garantia":"valor ou null"},'
      + '"frentes":[{"nome":"","descricao":"","incerto":false}],'
      + '"incertos":["texto explicativo"]}';

    lancamentoEstado = 'carregando';
    render();

    try {
      var resposta = await window._anthropicSend(apiKey, system, [{ role: 'user', content: texto }]);
      var jsonStr = resposta.trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/,'').trim();
      var parsed = JSON.parse(jsonStr);

      // Filtrar campos com valor não-nulo
      var campos = {};
      Object.keys(parsed.campos || {}).forEach(function(k) {
        var val = parsed.campos[k];
        if (val !== null && val !== undefined && String(val).trim() !== '') {
          campos[k] = { valor: String(val).trim(), incluir: true };
        }
      });

      // Filtrar frentes com nome não-vazio e não duplicadas
      var frentesNomesExistentes = (info.frentes || []).map(function(f) { return f.nome.toLowerCase().trim(); });
      var frentes = (parsed.frentes || []).filter(function(f) {
        return f.nome && !frentesNomesExistentes.includes(f.nome.toLowerCase().trim());
      });
      frentes.forEach(function(f) { f.incluir = true; });

      if (Object.keys(campos).length === 0 && frentes.length === 0) {
        lancamentoEstado = 'entrada';
        render();
        toast('Nenhuma informação identificada no texto. Tente ser mais específico.');
        return;
      }

      lancamentoRevisao = {
        infoModo: true,
        campos: campos,
        frentes: frentes,
        incertos: Array.isArray(parsed.incertos) ? parsed.incertos : []
      };
      lancamentoEstado = 'revisao';
      render();
    } catch(e) {
      console.error('Erro ao interpretar informações:', e);
      lancamentoEstado = 'entrada';
      render();
      toast('Erro ao interpretar. Verifique sua chave de API e tente novamente.');
    }
  }

  function confirmarInfoObra() {
    var obra = getObra(obraAtualId);
    if (!obra || !lancamentoRevisao) return;
    var rev = lancamentoRevisao;
    if (!obra.info) obra.info = {};
    var totalGravado = 0;

    // Gravar campos escalares
    Object.keys(rev.campos || {}).forEach(function(campo) {
      var item = rev.campos[campo];
      if (!item.incluir) return;
      obra.info[campo] = item.valor;
      totalGravado++;
    });

    // Adicionar frentes
    if (!obra.info.frentes) obra.info.frentes = [];
    (rev.frentes || []).forEach(function(f) {
      if (!f.incluir || !f.nome) return;
      obra.info.frentes.push({
        id: 'frente_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
        nome: f.nome.trim(),
        descricao: (f.descricao || '').trim()
      });
      totalGravado++;
    });

    salvar();
    lancamentoEstado = 'gravado';
    toast(totalGravado + ' item' + (totalGravado !== 1 ? 'ns' : '') + ' gravado' + (totalGravado !== 1 ? 's' : '') + ' nas Informações!');
    render();
  }

  function _diasEntre(isoA, isoB) {
    return Math.round((new Date(isoB + 'T12:00:00') - new Date(isoA + 'T12:00:00')) / 86400000);
  }

  function _calcIndicadorEtapa(etapa) {
    var hoje = hojeISO();
    var ini = etapa.dataInicioPrevisto, fim = etapa.dataFimPrevisto;
    var pct = Number(etapa.percentual) || 0;
    var st  = etapa.status || 'nao_iniciada';
    if (st === 'concluida') return { label: 'Concluída', cls: 'crono-ind-ok', pdfCor: 'green' };
    if (!ini || !fim)       return { label: '—',         cls: 'crono-ind-wait', pdfCor: 'cinza' };
    if (hoje < ini && pct === 0) return { label: 'Aguardando', cls: 'crono-ind-wait', pdfCor: 'cinza' };
    if (hoje > fim && pct < 100) return { label: 'Atrasada',   cls: 'crono-ind-late', pdfCor: 'red' };
    var totalDias = Math.max(1, _diasEntre(ini, fim));
    var decorridos = Math.min(Math.max(0, _diasEntre(ini, hoje)), totalDias);
    var pctEsp = (decorridos / totalDias) * 100;
    if (pct >= pctEsp + 5)    return { label: 'Adiantada', cls: 'crono-ind-ok',   pdfCor: 'green' };
    if (pct < pctEsp - 15)    return { label: 'Atrasada',  cls: 'crono-ind-late', pdfCor: 'red' };
    return                            { label: 'No prazo',  cls: 'crono-ind-warn', pdfCor: 'amber' };
  }

  function _pctGeralCronograma(etapas) {
    if (!etapas || etapas.length === 0) return 0;
    var soma = etapas.reduce(function(s, e) { return s + (Number(e.percentual) || 0); }, 0);
    return Math.round(soma / etapas.length);
  }

        html += '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">';
        html += '<button class="btn-mini" onclick="editarEtapa(\'' + etapa.id + '\')">Editar</button>';
        html += '<button class="btn-mini btn-mini-danger" onclick="removerEtapa(\'' + etapa.id + '\')">×</button>';

        if (etapa.dataInicioPrevisto && etapa.dataFimPrevisto) {
          html += '<div class="crono-etapa-datas">' + dateBR(etapa.dataInicioPrevisto) + ' → ' + dateBR(etapa.dataFimPrevisto) + duracaoTxt + '</div>';
        }
        html += '<div class="crono-bar-track"><div class="crono-bar-fill' + (etapa.status === 'concluida' ? ' conc' : '') + '" style="width:' + pct + '%;"></div></div>';
        html += '<div class="crono-meta">';
        html += '<span class="crono-pct">' + pct + '%</span>';
        html += '<span class="crono-status-badge ' + stClasse + '">' + stLabel + '</span>';

        html += '</div>';
      });
    }
    html += '</div></div>'; // card lista + col direita
    html += '</div>'; // two-col-layout

    return html;
  }

  // ── CRUD manual de etapas ──

  function salvarEtapa() {
    var obra = getObra(obraAtualId);
    if (!obra) return;
    if (!obra.cronograma) obra.cronograma = { etapas: [] };

    var nome = (document.getElementById('crono-nome') || {}).value || '';
    var desc = (document.getElementById('crono-desc') || {}).value || '';
    var ini  = (document.getElementById('crono-ini')  || {}).value || '';
    var fim  = (document.getElementById('crono-fim')  || {}).value || '';

    if (!nome.trim()) { alert('Informe o nome da etapa.'); return; }
    if (!ini || !fim) { alert('Informe as datas de início e término.'); return; }
    if (fim < ini)    { alert('A data de término deve ser igual ou posterior ao início.'); return; }

    if (cronoEtapaEditandoId) {
      var idx = obra.cronograma.etapas.findIndex(function(e) { return e.id === cronoEtapaEditandoId; });
      if (idx !== -1) {
        var pct = Math.min(100, Math.max(0, Number((document.getElementById('crono-pct') || {}).value) || 0));
        var st  = (document.getElementById('crono-status') || {}).value || 'nao_iniciada';
        obra.cronograma.etapas[idx].nome = nome.trim();
        obra.cronograma.etapas[idx].descricao = desc.trim();
        obra.cronograma.etapas[idx].dataInicioPrevisto = ini;
        obra.cronograma.etapas[idx].dataFimPrevisto = fim;
        obra.cronograma.etapas[idx].percentual = pct;
        obra.cronograma.etapas[idx].status = st;
      }
      cronoEtapaEditandoId = null;
      toast('Etapa atualizada.');
    } else {
      var ordem = obra.cronograma.etapas.length + 1;
      obra.cronograma.etapas.push({
        id: 'etapa_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        nome: nome.trim(),
        descricao: desc.trim(),
        dataInicioPrevisto: ini,
        dataFimPrevisto: fim,
        ordem: ordem,
        percentual: 0,
        status: 'nao_iniciada',
        criadaEm: new Date().toISOString()
      });
      toast('Etapa adicionada.');
    }
    salvar();
    render();
  }

  function editarEtapa(id) {
    cronoEtapaEditandoId = id;
    render();
    window.scrollTo(0, 0);
  }

  function cancelarEdicaoEtapa() {
    cronoEtapaEditandoId = null;
    render();
  }

  function removerEtapa(id) {
    if (!confirm('Remover esta etapa do cronograma?')) return;
    var obra = getObra(obraAtualId);
    if (!obra || !obra.cronograma) return;
    obra.cronograma.etapas = obra.cronograma.etapas.filter(function(e) { return e.id !== id; });
    salvar();
    render();
    toast('Etapa removida.');
  }

  // ── Assistente IA ──

  function setCronoIAModo(modo) {
    cronoIAModo = modo;
    document.querySelectorAll('.rel-quinzena-pill[data-cronomodo]').forEach(function(p) {
      p.classList.toggle('active', p.dataset.cronomodo === modo);
    });
    var el = document.getElementById('crono-ia-input');
    if (!el) return;
    el.placeholder = modo === 'montar'
      ? 'Ex: A obra tem 4 etapas: remoção de rejunte de 27/05 a 05/06, impermeabilização de 06/06 a 20/06...'
      : 'Ex: A remoção está 100% concluída, impermeabilização em 40%, o resto não começou.';
  }

  async function interpretarCronograma() {
    var textarea = document.getElementById('crono-ia-input');
    var texto = textarea ? textarea.value.trim() : '';
    if (!texto) { alert('Digite o texto antes de interpretar.'); return; }
    cronoIATexto = texto;

    var apiKey = localStorage.getItem(KEY_IA);
    if (!apiKey) { abrirModalChaveIA(); return; }
    if (!window._anthropicSend) { alert('SDK ainda carregando — aguarde e tente novamente.'); return; }

    var obra = getObra(obraAtualId);
    if (!obra) return;

    cronoIAEstado = 'carregando';
    render();

    if (cronoIAModo === 'montar') {
      await _interpretarMontarCronograma(obra, texto, apiKey);
    } else {
      await _interpretarAndamentoCronograma(obra, texto, apiKey);
    }
  }

  async function _interpretarMontarCronograma(obra, texto, apiKey) {
    var system = 'Você é um assistente de planejamento de obras para o app AS Construction.\n'
      + 'Interprete a descrição em linguagem natural e estruture as etapas do cronograma.\n'
      + 'Retorne APENAS JSON válido, sem markdown, sem explicações.\n\n'
      + 'OBRA: ' + obra.nome + '\n'
      + 'DATA HOJE: ' + hojeISO() + '\n\n'
      + 'REGRAS:\n'
      + '1. Extraia cada etapa mencionada com nome, datas início e fim no formato YYYY-MM-DD.\n'
      + '2. Mantenha a ordem cronológica. Atribua campo "ordem" crescente (1, 2, 3...).\n'
      + '3. Para datas relativas ("mês que vem", "daqui a 15 dias") calcule a partir de DATA HOJE.\n'
      + '4. Se uma data for ambígua ou ausente → incerto:true + nota em "incertos".\n'
      + '5. Descrição: 1-2 frases resumindo a atividade da etapa.\n'
      + '6. Nunca invente datas não mencionadas. Prefira incerto:true.\n\n'
      + 'FORMATO DE RETORNO:\n'
      + '{"etapas":[{"nome":"","descricao":"","dataInicioPrevisto":"YYYY-MM-DD","dataFimPrevisto":"YYYY-MM-DD","ordem":1,"incerto":false}],"incertos":[]}';

    try {
      var resp = await window._anthropicSend(apiKey, system, [{ role: 'user', content: texto }]);
      var jsonStr = resp.trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/,'').trim();
      var parsed = JSON.parse(jsonStr);
      var etapas = (parsed.etapas || []).filter(function(e) { return e.nome; });
      etapas.forEach(function(e) { e.incluir = true; });
      if (etapas.length === 0) {
        cronoIAEstado = 'entrada';
        render();
        toast('Nenhuma etapa identificada. Tente descrever com mais detalhes.');
        return;
      }
      cronoIARevisao = { etapas: etapas, incertos: parsed.incertos || [] };
      cronoIAEstado = 'revisao';
      render();
    } catch(e) {
      console.error(e);
      cronoIAEstado = 'entrada';
      render();
      toast('Erro ao interpretar. Verifique sua chave de API e tente novamente.');
    }
  }

  async function _interpretarAndamentoCronograma(obra, texto, apiKey) {
    var etapas = (obra.cronograma && obra.cronograma.etapas) || [];
    if (etapas.length === 0) {
      cronoIAEstado = 'entrada';
      render();
      toast('Cadastre etapas no cronograma antes de atualizar o andamento.');
      return;
    }
    var listaEtapas = etapas.map(function(e) {
      return e.id + ' | ' + e.nome + ' | ' + (Number(e.percentual)||0) + '% | ' + (e.status || 'nao_iniciada');
    }).join('\n');

    var system = 'Você é um assistente de acompanhamento de obras para o app AS Construction.\n'
      + 'Interprete o relato de progresso e mapeie os percentuais para as etapas cadastradas.\n'
      + 'Retorne APENAS JSON válido, sem markdown, sem explicações.\n\n'
      + 'ETAPAS CADASTRADAS:\n' + listaEtapas + '\n\n'
      + 'REGRAS:\n'
      + '1. Mapeie cada menção a uma etapa da lista acima (busca aproximada por nome).\n'
      + '2. Nunca crie etapas novas — só atualize as existentes pelo etapaId.\n'
      + '3. "concluída/pronta/100%/finalizada" → percentual:100, status:"concluida".\n'
      + '4. "em andamento/N%" → status:"em_andamento", percentual conforme mencionado.\n'
      + '5. "não começou/0%/aguardando" → percentual:0, status:"nao_iniciada".\n'
      + '6. Se ambíguo → incerto:true + nota em "incertos".\n\n'
      + 'FORMATO DE RETORNO:\n'
      + '{"atualizacoes":[{"etapaId":"","percentual":0,"status":"nao_iniciada","incerto":false}],"incertos":[]}';

    try {
      var resp = await window._anthropicSend(apiKey, system, [{ role: 'user', content: texto }]);
      var jsonStr = resp.trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/,'').trim();
      var parsed = JSON.parse(jsonStr);
      var atualizacoes = (parsed.atualizacoes || []).filter(function(a) {
        return a.etapaId && etapas.find(function(e) { return e.id === a.etapaId; });
      });
      atualizacoes.forEach(function(a) { a.incluir = true; });
      if (atualizacoes.length === 0) {
        cronoIAEstado = 'entrada';
        render();
        toast('Nenhuma etapa correspondente encontrada. Verifique o texto e tente novamente.');
        return;
      }
      cronoIARevisao = { atualizacoes: atualizacoes, incertos: parsed.incertos || [] };
      cronoIAEstado = 'revisao';
      render();
    } catch(e) {
      console.error(e);
      cronoIAEstado = 'entrada';
      render();
      toast('Erro ao interpretar. Verifique sua chave de API e tente novamente.');
    }
  }

  // ── Confirmar ──

  function confirmarCronoMontar() {
    var obra = getObra(obraAtualId);
    if (!obra || !cronoIARevisao) return;
    if (!obra.cronograma) obra.cronograma = { etapas: [] };
    var etapas = (cronoIARevisao.etapas || []).filter(function(e) { return e.incluir && e.nome; });
    var ordemBase = obra.cronograma.etapas.length;
    etapas.forEach(function(e, i) {
      obra.cronograma.etapas.push({
        id: 'etapa_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2,5),
        nome: e.nome.trim(),
        descricao: (e.descricao || '').trim(),
        dataInicioPrevisto: e.dataInicioPrevisto || '',
        dataFimPrevisto: e.dataFimPrevisto || '',
        ordem: ordemBase + i + 1,
        percentual: 0,
        status: 'nao_iniciada',
        criadaEm: new Date().toISOString()
      });
    });
    salvar();
    cronoIAEstado = 'gravado';
    toast(etapas.length + ' etapa' + (etapas.length!==1?'s':'') + ' adicionada' + (etapas.length!==1?'s':'') + ' ao cronograma!');

  function confirmarCronoAndamento() {
    var obra = getObra(obraAtualId);
    if (!obra || !cronoIARevisao || !obra.cronograma) return;
    var ats = (cronoIARevisao.atualizacoes || []).filter(function(a) { return a.incluir; });
    ats.forEach(function(a) {
      var idx = obra.cronograma.etapas.findIndex(function(e) { return e.id === a.etapaId; });
      if (idx === -1) return;
      obra.cronograma.etapas[idx].percentual = Math.min(100, Math.max(0, Number(a.percentual) || 0));
      obra.cronograma.etapas[idx].status = a.status || 'nao_iniciada';
    });
    salvar();
    cronoIAEstado = 'gravado';
    toast(ats.length + ' etapa' + (ats.length!==1?'s':'') + ' atualizada' + (ats.length!==1?'s':'') + '!');
    render();
  }

  // ── PDF 1: Cronograma da Obra ──

  function gerarPDFCronograma() {
    var obra = getObra(obraAtualId);
    if (!obra) return;
    var etapas = (obra.cronograma && obra.cronograma.etapas) || [];
    if (etapas.length === 0) { alert('Cadastre ao menos uma etapa no cronograma antes de gerar o PDF.'); return; }
    function _doGerar(logoURL) {
      if (window.jspdf) { _gerarPDFCronograma(obra, logoURL); return; }
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = function() { _gerarPDFCronograma(obra, logoURL); };
      document.head.appendChild(s);
    }
    _fetchLogoDataURL(_doGerar);
  }

  function _gerarPDFCronograma(obra, logoURL) {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: 'mm', format: 'a4' });
    var PW = 210, PH = 297, ML = 15, CW = 180;
    var info = obra.info || {};
    var etapas = (obra.cronograma && obra.cronograma.etapas) || [];

    var mesNomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    function addHeader() {
      doc.setFillColor(115, 1, 140);
      doc.rect(0, 0, PW, 14, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8);
      doc.text('AS CONSTRUCTION', ML, 9);
      doc.setFont('helvetica','normal');
      doc.text('Cronograma da Obra', PW - ML, 9, { align: 'right' });
      doc.setTextColor(30,30,30);
    }

    function checkY(y, extra) { extra = extra || 10; if (y + extra > PH - 18) { doc.addPage(); addHeader(); return 22; } return y; }

    function secTitle(y, txt) {
      y = checkY(y, 12);
      doc.setFillColor(245, 240, 250); doc.rect(ML, y, CW, 7, 'F');
      doc.setTextColor(115,1,140); doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.text(txt, ML + 3, y + 5);
      doc.setTextColor(30,30,30); doc.setFont('helvetica','normal');
      return y + 11;
    }

    // ── CAPA ──
    doc.setFillColor(115, 1, 140);
    doc.rect(0, 0, PW, 38, 'F');
    if (logoURL) { try { doc.addImage(logoURL, 'PNG', ML, 6, 44, 22); } catch(e) {} }
    doc.setTextColor(255,255,255); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('AS CONSTRUCTION', PW - ML, 14, { align: 'right' });

    doc.setTextColor(30,30,30);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('CRONOGRAMA DA OBRA', PW/2, 60, { align: 'center' });
    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text(obra.nome || '', PW/2, 74, { align: 'center' });
    if (info.clienteRazaoSocial) {
      doc.setFont('helvetica','normal'); doc.setFontSize(11);
      doc.text(info.clienteRazaoSocial, PW/2, 84, { align: 'center' });
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100,100,100);
    doc.text('Emitido em: ' + dateBR(hojeISO()), PW/2, 96, { align: 'center' });

    doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text('AS Construction  ·  Pág. 1', PW/2, PH - 8, { align: 'center' });

    // ── CORPO ──
    doc.addPage(); addHeader();
    var y = 24;

    // 1. Dados da obra
    y = secTitle(y, '1. DADOS DA OBRA');
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(100,100,100);
    doc.text('Obra:', ML, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
    var nomeLines = doc.splitTextToSize(obra.nome || '', CW - 28);
    doc.text(nomeLines, ML + 28, y);
    y += Math.max(6, nomeLines.length * 5);

    if (info.clienteRazaoSocial) {
      y = checkY(y, 7);
      doc.setFont('helvetica','bold'); doc.setTextColor(100,100,100);
      doc.text('Cliente:', ML, y);
      doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
      doc.text(info.clienteRazaoSocial, ML + 28, y);
      y += 7;
    }

    if (etapas.length > 0) {
      var datasValidas = etapas.filter(function(e) { return e.dataInicioPrevisto && e.dataFimPrevisto; });
      if (datasValidas.length > 0) {
        var iniGeral = datasValidas.reduce(function(a,b) { return b.dataInicioPrevisto < a ? b.dataInicioPrevisto : a; }, datasValidas[0].dataInicioPrevisto);
        var fimGeral = datasValidas.reduce(function(a,b) { return b.dataFimPrevisto > a ? b.dataFimPrevisto : a; }, datasValidas[0].dataFimPrevisto);
        var diasTotal = _diasEntre(iniGeral, fimGeral);
        y = checkY(y, 7);
        doc.setFont('helvetica','bold'); doc.setTextColor(100,100,100);
        doc.text('Período:', ML, y);
        doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
        doc.text(dateBR(iniGeral) + ' → ' + dateBR(fimGeral) + '  (' + diasTotal + ' dias)', ML + 28, y);
        y += 7;
      }
    }
    y += 4;

    // 2. Etapas
    y = secTitle(y, '2. ETAPAS DO CRONOGRAMA');

    // Cabeçalho da tabela
    var cols = { n: ML, nome: ML+8, ini: ML+68, fim: ML+104, dur: ML+140, desc: ML+162 };
    doc.setFillColor(240,240,245); doc.rect(ML, y, CW, 7, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(80,80,80);
    doc.text('Nº', cols.n, y+5);
    doc.text('ETAPA', cols.nome, y+5);
    doc.text('INÍCIO', cols.ini, y+5);
    doc.text('TÉRMINO', cols.fim, y+5);
    doc.text('DURAÇÃO', cols.dur, y+5);
    y += 9;

    etapas.forEach(function(e, i) {
      var durTxt = '';
      if (e.dataInicioPrevisto && e.dataFimPrevisto) {
        var d = _diasEntre(e.dataInicioPrevisto, e.dataFimPrevisto);
        durTxt = d + ' dia' + (d!==1?'s':'');
      }
      var nomeLines = doc.splitTextToSize(e.nome || '', 55);
      var descLines = e.descricao ? doc.splitTextToSize(e.descricao, CW - 6) : [];
      var rowH = Math.max(8, nomeLines.length * 5) + (descLines.length > 0 ? descLines.length * 4.5 + 3 : 0);
      y = checkY(y, rowH + 2);

      if (i % 2 === 0) { doc.setFillColor(252,250,254); doc.rect(ML, y-1, CW, rowH + 2, 'F'); }
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(115,1,140);
      doc.text(String(i+1), cols.n, y+4);
      doc.setTextColor(30,30,30);
      doc.text(nomeLines, cols.nome, y+4);
      doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(e.dataInicioPrevisto ? dateBR(e.dataInicioPrevisto) : '—', cols.ini, y+4);
      doc.text(e.dataFimPrevisto   ? dateBR(e.dataFimPrevisto)    : '—', cols.fim, y+4);
      doc.text(durTxt, cols.dur, y+4);
      if (descLines.length > 0) {
        var descY = y + Math.max(7, nomeLines.length * 5) + 1;
        doc.setTextColor(100,100,100); doc.setFontSize(7.5);
        doc.text(descLines, cols.nome, descY);
        doc.setTextColor(30,30,30);
      }
      y += rowH + 4;
    });
    y += 4;

    // 3. Linha do tempo (Gantt quinzenal)
    var datasValidas2 = etapas.filter(function(e) { return e.dataInicioPrevisto && e.dataFimPrevisto; });
    if (datasValidas2.length > 0) {
      y = secTitle(y, '3. LINHA DO TEMPO');
      var iniG2 = datasValidas2.reduce(function(a,b){ return b.dataInicioPrevisto<a?b.dataInicioPrevisto:a; }, datasValidas2[0].dataInicioPrevisto);
      var fimG2 = datasValidas2.reduce(function(a,b){ return b.dataFimPrevisto>a?b.dataFimPrevisto:a; }, datasValidas2[0].dataFimPrevisto);

      // Calcular quinzenas abrangidas
      var quins = [];
      var cur = new Date(iniG2 + 'T12:00:00');
      cur.setDate(1);
      var fimDate = new Date(fimG2 + 'T12:00:00');
      fimDate.setMonth(fimDate.getMonth()+1); fimDate.setDate(1);
      while (cur < fimDate) {
        var m = cur.getMonth(), a = cur.getFullYear();
        quins.push({ ano: a, mes: m, q: 1, ini: a + '-' + String(m+1).padStart(2,'0') + '-01', fim: a + '-' + String(m+1).padStart(2,'0') + '-15' });
        var lastDay = new Date(a, m+1, 0).getDate();
        quins.push({ ano: a, mes: m, q: 2, ini: a + '-' + String(m+1).padStart(2,'0') + '-16', fim: a + '-' + String(m+1).padStart(2,'0') + '-' + String(lastDay).padStart(2,'0') });
        cur.setMonth(cur.getMonth()+1);
      }

      var colNome = 42, ganttX = ML + colNome, colW = Math.min(10, Math.floor(CW - colNome) / quins.length);
      var ganttW = quins.length * colW;
      y = checkY(y, 12 + etapas.length * 8 + 20);

      // Cabeçalho meses (agrupado)
      var mesGrupos = [];
      var lastM = -1;
      quins.forEach(function(q, i) {
        if (q.mes !== lastM) { mesGrupos.push({ mes: q.mes, ano: q.ano, startIdx: i, count: 0 }); lastM = q.mes; }
        mesGrupos[mesGrupos.length-1].count++;
      });
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(80,80,80);
      mesGrupos.forEach(function(g) {
        var mx = ganttX + g.startIdx * colW;
        doc.setFillColor(235,228,245); doc.rect(mx, y, g.count * colW, 5, 'F');
        doc.setTextColor(115,1,140);
        doc.text(mesNomes[g.mes].substring(0,3).toUpperCase() + '/' + String(g.ano).slice(2), mx + (g.count*colW/2), y+3.5, { align: 'center' });
      });
      y += 5;

      // Indicadores quinzena
      doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(130,130,130);
      quins.forEach(function(q, i) {
        var qx = ganttX + i * colW;
        doc.text(q.q === 1 ? '1ª' : '2ª', qx + colW/2, y+3.5, { align: 'center' });
        doc.setDrawColor(210,210,210);
        doc.line(qx, y, qx, y + 5 + etapas.length * 8);
      });
      y += 5;

      // Linhas por etapa
      etapas.forEach(function(e, ei) {
        var nomeLabel = doc.splitTextToSize(e.nome || '', colNome - 4);
        var rowH = nomeLabel.length > 1 ? 13 : 8;
        y = checkY(y, rowH);
        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(30,30,30);
        doc.text(nomeLabel[0] || '', ML, y+5);
        if (nomeLabel.length > 1) doc.text(nomeLabel[1], ML, y+9);

        quins.forEach(function(q, qi) {
          var qx = ganttX + qi * colW;
          var ativa = e.dataInicioPrevisto && e.dataFimPrevisto && q.fim >= e.dataInicioPrevisto && q.ini <= e.dataFimPrevisto;
          if (ativa) {
            doc.setFillColor(115, 1, 140);
          } else {
            doc.setFillColor(230, 225, 240);
          }
          doc.rect(qx + 0.5, y + 1.5, colW - 1, 5, 'F');
        });
        y += rowH;
      });

      // Legenda
      y += 4;
      doc.setFillColor(115,1,140); doc.rect(ML, y, 6, 4, 'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(80,80,80);
      doc.text('Duração prevista', ML+8, y+3);
      y += 10;
    }

    // Rodapé páginas
    var totalPgs = doc.getNumberOfPages();
    for (var pg = 1; pg <= totalPgs; pg++) {
      doc.setPage(pg);
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(150,150,150);
      doc.text('AS Construction  ·  Cronograma da Obra  ·  ' + dateBR(hojeISO()), PW/2, PH-5, { align: 'center' });
      doc.text('Pág. ' + pg + ' / ' + totalPgs, PW - ML, PH-5, { align: 'right' });
    }

    var slug = (obra.nome || 'obra').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 30);
    doc.save('cronograma-' + slug + '.pdf');
  }

  // ── PDF 2: Relatório de Andamento ──

  function gerarRelatorioAndamento() {
    var obra = getObra(obraAtualId);
    if (!obra) return;
    var etapas = (obra.cronograma && obra.cronograma.etapas) || [];
    if (etapas.length === 0) { alert('Cadastre etapas no cronograma antes de gerar o relatório.'); return; }
    function _doGerar(logoURL) {
      if (window.jspdf) { _gerarRelatorioAndamento(obra, logoURL); return; }
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = function() { _gerarRelatorioAndamento(obra, logoURL); };
      document.head.appendChild(s);
    }
    _fetchLogoDataURL(_doGerar);
  }

  function _gerarRelatorioAndamento(obra, logoURL) {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: 'mm', format: 'a4' });
    var PW = 210, PH = 297, ML = 15, CW = 180;
    var info = obra.info || {};
    var etapas = (obra.cronograma && obra.cronograma.etapas) || [];
    var hoje = hojeISO();
    var mesNomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    // Período do relatório: últimos 15 dias
    var hojeDate = new Date(hoje + 'T12:00:00');
    var iniPeriodo = new Date(hojeDate); iniPeriodo.setDate(iniPeriodo.getDate() - 14);
    var iniPeriodoISO = iniPeriodo.toISOString().slice(0,10);
    var dia = hojeDate.getDate(), mes = hojeDate.getMonth(), ano = hojeDate.getFullYear();
    var quinzena = dia <= 15 ? '1ª Quinzena' : '2ª Quinzena';
    var periodoLabel = quinzena + ' · ' + mesNomes[mes] + '/' + ano;

    function addHeader() {
      doc.setFillColor(115, 1, 140); doc.rect(0, 0, PW, 14, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8);
      doc.text('AS CONSTRUCTION', ML, 9);
      doc.setFont('helvetica','normal');
      doc.text('Relatório de Andamento', PW - ML, 9, { align: 'right' });
      doc.setTextColor(30,30,30);
    }

    function checkY(y, extra) { extra = extra||10; if (y + extra > PH - 18) { doc.addPage(); addHeader(); return 22; } return y; }

    function secTitle(y, txt) {
      y = checkY(y, 12);
      doc.setFillColor(245, 240, 250); doc.rect(ML, y, CW, 7, 'F');
      doc.setTextColor(115,1,140); doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.text(txt, ML+3, y+5);
      doc.setTextColor(30,30,30); doc.setFont('helvetica','normal');
      return y + 11;
    }

    // ── CAPA ──
    doc.setFillColor(115, 1, 140); doc.rect(0, 0, PW, 38, 'F');
    if (logoURL) { try { doc.addImage(logoURL, 'PNG', ML, 6, 44, 22); } catch(e) {} }
    doc.setTextColor(255,255,255); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('AS CONSTRUCTION', PW-ML, 14, { align: 'right' });

    doc.setTextColor(30,30,30);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('RELATÓRIO DE ANDAMENTO', PW/2, 60, { align: 'center' });
    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text(obra.nome || '', PW/2, 74, { align: 'center' });
    if (info.clienteRazaoSocial) {
      doc.setFont('helvetica','normal'); doc.setFontSize(11);
      doc.text(info.clienteRazaoSocial, PW/2, 84, { align: 'center' });
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(80,80,80);
    doc.text('Período: ' + periodoLabel, PW/2, 94, { align: 'center' });
    doc.setTextColor(100,100,100);
    doc.text('Data: ' + dateBR(hoje), PW/2, 102, { align: 'center' });
    doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text('AS Construction  ·  Pág. 1', PW/2, PH-8, { align: 'center' });

    // ── CORPO ──
    doc.addPage(); addHeader();
    var y = 24;

    // 1. Andamento Geral
    y = secTitle(y, '1. ANDAMENTO GERAL');
    var pctGeral = _pctGeralCronograma(etapas);
    var concluidas = etapas.filter(function(e){ return e.status==='concluida'; }).length;

    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(100,100,100);
    doc.text('Conclusão geral:', ML, y);
    doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(115,1,140);
    doc.text(pctGeral + '%', ML + 44, y+1);
    doc.setTextColor(30,30,30); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    y += 8;

    // Barra geral
    var barW = CW;
    doc.setFillColor(220,215,235); doc.rect(ML, y, barW, 6, 'F');
    if (pctGeral > 0) { doc.setFillColor(115,1,140); doc.rect(ML, y, barW * pctGeral / 100, 6, 'F'); }
    y += 10;

    doc.setTextColor(80,80,80); doc.setFontSize(8);
    doc.text('Etapas concluídas: ' + concluidas + ' de ' + etapas.length, ML, y);
    y += 6;
    doc.text('Período do relatório: ' + dateBR(iniPeriodoISO) + ' a ' + dateBR(hoje), ML, y);
    y += 10;

    // 2. Status por etapa
    y = secTitle(y, '2. STATUS POR ETAPA');

    // Cabeçalho tabela
    doc.setFillColor(240,240,245); doc.rect(ML, y, CW, 7, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(80,80,80);
    var cols2 = { nome: ML+2, prazo: ML+60, pct: ML+108, status: ML+122, sit: ML+152 };
    doc.text('ETAPA', cols2.nome, y+5);
    doc.text('PRAZO PREVISTO', cols2.prazo, y+5);
    doc.text('%', cols2.pct, y+5);
    doc.text('STATUS', cols2.status, y+5);
    doc.text('SITUAÇÃO', cols2.sit, y+5);
    y += 9;

    etapas.forEach(function(e, ei) {
      var ind = _calcIndicadorEtapa(e);
      var pct = Number(e.percentual) || 0;
      var stLabel = e.status==='concluida' ? 'Concluída' : e.status==='em_andamento' ? 'Em andamento' : 'Não iniciada';
      var prazoTxt = (e.dataInicioPrevisto && e.dataFimPrevisto) ? dateBR(e.dataInicioPrevisto) + ' → ' + dateBR(e.dataFimPrevisto) : '—';
      var nomeLines = doc.splitTextToSize(e.nome||'', 55);
      var rowH = Math.max(8, nomeLines.length * 5);
      y = checkY(y, rowH + 2);
      if (ei % 2 === 0) { doc.setFillColor(252,250,254); doc.rect(ML, y-1, CW, rowH+2, 'F'); }

      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(30,30,30);
      doc.text(nomeLines, cols2.nome, y+4);
      doc.setFontSize(7.5);
      doc.text(prazoTxt, cols2.prazo, y+4);
      doc.setFont('helvetica','bold'); doc.setTextColor(115,1,140);
      doc.text(pct + '%', cols2.pct, y+4);
      doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30); doc.setFontSize(7.5);
      doc.text(stLabel, cols2.status, y+4);
      // Indicador colorido
      var indColor = ind.pdfCor === 'green' ? [5,150,105] : ind.pdfCor === 'red' ? [220,38,38] : ind.pdfCor === 'amber' ? [217,119,6] : [150,150,150];
      doc.setFont('helvetica','bold'); doc.setTextColor(indColor[0], indColor[1], indColor[2]);
      doc.text(ind.label, cols2.sit, y+4);
      doc.setTextColor(30,30,30); doc.setFont('helvetica','normal');
      y += rowH + 4;
    });
    y += 4;

    // 3. Progresso visual (barras por etapa)
    y = secTitle(y, '3. PROGRESSO POR ETAPA');
    etapas.forEach(function(e) {
      y = checkY(y, 12);
      var pct = Number(e.percentual) || 0;
      var nomeLabel = doc.splitTextToSize(e.nome||'', 55);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(30,30,30);
      doc.text(nomeLabel[0]||'', ML, y+4);
      var barX = ML+58, barW2 = CW-80, barH = 5;
      doc.setFillColor(220,215,235); doc.rect(barX, y+1, barW2, barH, 'F');
      var fillColor = e.status==='concluida' ? [5,150,105] : [115,1,140];
      if (pct > 0) { doc.setFillColor(fillColor[0],fillColor[1],fillColor[2]); doc.rect(barX, y+1, barW2*pct/100, barH, 'F'); }
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
      var indProg = _calcIndicadorEtapa(e);
      var indC2 = indProg.pdfCor==='green'?[5,150,105]:indProg.pdfCor==='red'?[220,38,38]:indProg.pdfCor==='amber'?[217,119,6]:[150,150,150];
      doc.setTextColor(115,1,140); doc.text(pct+'%', barX + barW2 + 3, y+5);
      doc.setTextColor(indC2[0],indC2[1],indC2[2]); doc.text(indProg.label, barX + barW2 + 16, y+5);
      doc.setTextColor(30,30,30);
      y += 10;
    });
    y += 4;

    // 4. Atividades do Diário no período
    var diariosPeriodo = (obra.diario || []).filter(function(d) { return d.data >= iniPeriodoISO && d.data <= hoje; }).sort(function(a,b){ return a.data > b.data ? -1 : 1; });
    if (diariosPeriodo.length > 0) {
      y = secTitle(y, '4. ATIVIDADES EXECUTADAS NO PERÍODO');
      diariosPeriodo.forEach(function(d) {
        var descLines = doc.splitTextToSize(d.descricao||'', CW-28);
        var badges = [];
        if (d.percentual !== null && d.percentual !== undefined) badges.push(d.percentual + '%');
        if (d.etapa) badges.push(d.etapa);
        var blockH = Math.max(10, descLines.length * 5 + (badges.length > 0 ? 5 : 0) + 4);
        y = checkY(y, blockH);
        doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(115,1,140);
        doc.text(dateBR(d.data), ML, y+4);
        doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
        doc.text(descLines, ML+28, y+4);
        if (badges.length > 0) { doc.setTextColor(100,100,100); doc.text(badges.join(' · '), ML+28, y+4+descLines.length*5); }
        doc.setTextColor(30,30,30);
        y += blockH;
      });
      y += 4;
    }

    // 5. Próximas etapas
    var proximas = etapas.filter(function(e) { return e.status !== 'concluida'; }).slice(0, 4);
    if (proximas.length > 0) {
      y = secTitle(y, diariosPeriodo.length > 0 ? '5. PRÓXIMAS ETAPAS' : '4. PRÓXIMAS ETAPAS');
      proximas.forEach(function(e) {
        y = checkY(y, 8);
        doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(115,1,140);
        doc.text('→', ML, y+4);
        doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
        var txt = e.nome;
        if (e.status === 'em_andamento' && e.dataFimPrevisto) {
          var diasR = _diasEntre(hoje, e.dataFimPrevisto);
          txt += ': conclusão prevista ' + dateBR(e.dataFimPrevisto) + (diasR >= 0 ? ' (' + diasR + ' dia' + (diasR!==1?'s':'') + ' restante' + (diasR!==1?'s':'') + ')' : ' — prazo vencido');
        } else if (e.status === 'nao_iniciada' && e.dataInicioPrevisto) {
          txt += ': início previsto ' + dateBR(e.dataInicioPrevisto);
        }
        var tLines = doc.splitTextToSize(txt, CW-8);
        doc.text(tLines, ML+6, y+4);
        y += Math.max(8, tLines.length * 5) + 3;
      });
      y += 4;
    }

    // Nota de rodapé do documento
    y = checkY(y, 14);
    doc.setDrawColor(200,190,215); doc.line(ML, y, ML+CW, y);
    y += 6;
    doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(120,120,120);
    doc.text('Documento emitido para liberação de pagamento/nota fiscal. Não contém informações financeiras internas.', ML, y);
    y += 8;
    doc.setFont('helvetica','bold'); doc.setTextColor(115,1,140);
    doc.text('AS Construction', PW - ML, y, { align: 'right' });

    // Numeração das páginas
    var totalPgs = doc.getNumberOfPages();
    for (var pg = 1; pg <= totalPgs; pg++) {
      doc.setPage(pg);
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(150,150,150);
      doc.text('AS Construction  ·  Relatório de Andamento  ·  ' + dateBR(hoje), PW/2, PH-5, { align: 'center' });
      doc.text('Pág. ' + pg + ' / ' + totalPgs, PW-ML, PH-5, { align: 'right' });
    }

    var slug = (obra.nome||'obra').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,30);
    doc.save('andamento-' + slug + '-' + hoje + '.pdf');
  }

  function inicializarAtmosphera() {
    if (estado.obras.length > 0) return;
    const obraAtmo = {
      id: 'obra_atmosphera_inicial',
      nome: 'Atmosphera',
      cliente: 'Complexo Atmosphera',
      contrato: 96000,
      impostoPct: 13,
      dataInicio: '2026-05-27',
      dataPrevisao: '2026-08-10',
      status: 'andamento',
      valorMarmita: 30,
      nota: 'Contrato assinado com Cássia Leal (Diretora Superintendente). Pagamento: 20% entrada + 4 parcelas quinzenais. Multas: 0,5%/dia após 60 dias de atraso. Garantia contratual: 5 anos.',
      diarias: [],
      gastosAvulsos: [],
      empreitadas: [
        {
          id: 'e_alessandro_inicial',
          nome: 'Alessandro - retirada do rejuntamento das piscinas',
          valor: 13000,
          bonus: 1000,
          pago: false,
          bonusPago: false
        }
      ],
      trabalhadores: [
        { id: 't_carlos_inicial', nome: 'Carlos', diaria: 130 },
        { id: 't_emerson_inicial', nome: 'Emerson', diaria: 150 }
      ],
      recebimentos: [],
      criadaEm: new Date().toISOString()
    };
    estado.obras.push(obraAtmo);
    salvar();
  }

  // ============ FIREBASE — Login + Nuvem ============

  let _toastTimer = null;
  function toast(msg) {
    const existing = document.getElementById('_toast_notif');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.id = '_toast_notif';
    el.className = 'toast-notif';
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { if (el.parentNode) el.remove(); }, 1800);
  }

  let _avisoSyncTimer = null;
  function mostrarAvisoSync(msg) {
    let el = document.getElementById('aviso-sync');
    if (!el) {
      el = document.createElement('div');
      el.id = 'aviso-sync';
      el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.25);font-family:-apple-system,sans-serif;max-width:320px;text-align:center;';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(_avisoSyncTimer);
    _avisoSyncTimer = setTimeout(() => { if (el) el.style.opacity = '0'; }, 4000);
  }

  function renderTelaLogin() {
    // Dark como padrão para novos usuários sem preferência salva
    if (localStorage.getItem(KEY_THEME) === null) {
      temaEscuro = true;
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem(KEY_THEME, 'dark');
    }
    const toggleIcon = temaEscuro ? '☀' : '◑';
    const googleSVG = '<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.118-.843 2.065-1.796 2.702v2.246h2.908C16.534 14.175 17.64 11.9 17.64 9.2z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.246c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.318C2.438 15.983 5.482 18 9 18z" fill="#34A853"/><path d="M3.964 10.712A5.413 5.413 0 0 1 3.682 9c0-.593.102-1.17.282-1.712V4.97H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.03l3.007-2.318z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.969L3.964 6.288C4.672 4.161 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>';
    return '<div class="login-page">'
      + '<button class="btn-theme login-theme-btn" onclick="toggleTema()" title="Alternar tema">' + toggleIcon + '</button>'
      + '<div class="login-content">'
      +   '<div class="login-mark">'
      +     '<span class="login-as">AS</span>'
      +     '<span class="login-wordmark">Construction</span>'
      +   '</div>'
      +   '<p class="login-tagline">Engenharia industrial de precisão</p>'
      +   '<button class="btn-google" id="btn-login-google" onclick="entrarComGoogle()">'
      +     googleSVG + 'Entrar com Google'
      +   '</button>'
      + '</div>'
      + '<footer class="login-footer">Versão 1.0 &nbsp;·&nbsp; © 2026 AS Construction</footer>'
      + '</div>';
  }

  async function entrarComGoogle() {
    const btn = document.getElementById('btn-login-google');
    const googleSVG = '<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.118-.843 2.065-1.796 2.702v2.246h2.908C16.534 14.175 17.64 11.9 17.64 9.2z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.246c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.318C2.438 15.983 5.482 18 9 18z" fill="#34A853"/><path d="M3.964 10.712A5.413 5.413 0 0 1 3.682 9c0-.593.102-1.17.282-1.712V4.97H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.03l3.007-2.318z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.969L3.964 6.288C4.672 4.161 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>';
    const restoreBtn = () => {
      if (btn) { btn.disabled = false; btn.innerHTML = googleSVG + 'Entrar com Google'; }
    };
    if (btn) { btn.disabled = true; btn.textContent = 'Entrando...'; }
    try {
      await window._firebaseSignIn();
      // onAuthStateChanged handles navigation after successful login
    } catch(e) {
      const code = e.code || '';
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
        // User dismissed popup — restore button silently
        restoreBtn();
      } else if (code === 'auth/popup-blocked') {
        // Safari/iOS blocked the popup — fall back to redirect
        if (btn) { btn.textContent = 'Redirecionando...'; }
        try {
          await window._firebaseSignInRedirect();
          // Page will redirect; nothing further to do
        } catch(e2) {
          restoreBtn();
          alert('Não foi possível abrir o login do Google.\nPermita popups para este site e tente novamente.');
        }
      } else {
        restoreBtn();
        console.error('Login error:', code, e.message);
        alert('Não foi possível entrar. Tente novamente.');
      }
    }
  }

  async function sair() {
    if (!confirm('Deseja sair da sua conta?')) return;
    if (window._firebaseSignOut) await window._firebaseSignOut();
    usuarioAtual = null;
    _firestoreHadData = false;
    estado = { obras: [] };
    orcamentos = [];
    telaAtual = 'login';
    render();
  }

  async function carregarDaFirestore() {
    if (!usuarioAtual || !window._fbdb) return;
    _firestoreHadData = false;
    try {
      const uid = usuarioAtual.uid;
      const [obrasSnap, orcsSnap] = await Promise.all([
        window._fbdb.collection('usuarios').doc(uid).collection('dados').doc('obras').get(),
        window._fbdb.collection('usuarios').doc(uid).collection('dados').doc('orcamentos').get()
      ]);
      if (obrasSnap.exists) {
        _firestoreHadData = true;
        estado = { obras: migrarObras(obrasSnap.data().obras || []) };
      }
      if (orcsSnap.exists) {
        orcamentos = orcsSnap.data().orcamentos || [];
      }
    } catch(e) { console.error('Firestore load:', e); }
  }

  let _saveObrasTimer = null;
  function salvarNaFirestore() {
    if (!usuarioAtual || !window._fbdb) return;
    clearTimeout(_saveObrasTimer);
    _saveObrasTimer = setTimeout(async () => {
      const obras = estado.obras;
      try {
        await window._fbdb.collection('usuarios').doc(usuarioAtual.uid).collection('dados').doc('obras').set({ obras });
      } catch(e) {
        console.error('Firestore save obras:', e);
        mostrarAvisoSync('Dados salvos localmente. Falha ao sincronizar com a nuvem.');
      }
    }, 400);
  }

  let _saveOrcsTimer = null;
  function salvarOrcamentosNaFirestore() {
    if (!usuarioAtual || !window._fbdb) return;
    clearTimeout(_saveOrcsTimer);
    _saveOrcsTimer = setTimeout(async () => {
      const orcs = orcamentos;
      try {
        await window._fbdb.collection('usuarios').doc(usuarioAtual.uid).collection('dados').doc('orcamentos').set({ orcamentos: orcs });
      } catch(e) {
        console.error('Firestore save orcs:', e);
        mostrarAvisoSync('Dados salvos localmente. Falha ao sincronizar com a nuvem.');
      }
    }, 400);
  }

  function renderModalMigracao(nObras) {
    return '<div class="modal-title" style="margin-bottom:12px;">Migrar dados para a nuvem?</div>'
      + '<p style="font-size:14px;color:var(--ink-2);margin-bottom:20px;line-height:1.6;">Encontramos <strong>' + nObras + ' obra(s)</strong> salvas neste dispositivo. Deseja migrar para sua conta e acessar de qualquer lugar?</p>'
      + '<button class="btn-primary" onclick="window._confirmarMigracao()">Migrar agora</button>'
      + '<button class="btn-secondary" style="margin-top:8px;" onclick="window._ignorarMigracao()">Ignorar (manter só aqui)</button>';
  }

  function verificarMigracao() {
    if (_firestoreHadData) return false;
    const localRaw = localStorage.getItem(KEY);
    if (!localRaw) { estado = { obras: [] }; return false; }
    let localObras = [];
    try { localObras = JSON.parse(localRaw).obras || []; } catch(e) { return false; }
    // Exclui obra demo da migração — usuário novo não deve ver modal por causa dela
    const obrasReais = localObras.filter(o => o.id !== 'obra_atmosphera_inicial');
    if (obrasReais.length === 0) {
      // Só tinha demo (ou nada) — começa com estado limpo no Firestore
      estado = { obras: [] };
      return false;
    }
    document.getElementById('modal-content').innerHTML = renderModalMigracao(obrasReais.length);
    document.getElementById('modal-bg').classList.add('show');
    window._confirmarMigracao = async () => {
      document.getElementById('modal-bg').classList.remove('show');
      estado = { obras: migrarObras(obrasReais) };
      try { const localOrcs = JSON.parse(localStorage.getItem(KEY_ORC) || '[]'); orcamentos = Array.isArray(localOrcs) ? localOrcs : []; } catch(e) { orcamentos = []; }
      await Promise.all([salvarNaFirestore(), salvarOrcamentosNaFirestore()]);
      telaAtual = 'home';
      render();
    };
    window._ignorarMigracao = () => {
      document.getElementById('modal-bg').classList.remove('show');
      telaAtual = 'home';
      render();
    };
    return true;
  }

  inicializarAtmosphera();

  document.getElementById('root').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:80vh;color:var(--ink-3);font-size:15px;font-family:-apple-system,sans-serif;">Carregando...</div>';

  window._onAuthStateChanged = async function(user) {
    usuarioAtual = user;
    if (!user) { telaAtual = 'login'; render(); return; }
    await carregarDaFirestore();
    if (verificarMigracao()) return;
    if (telaAtual === 'login') telaAtual = 'home';
    render();
  };

  try {
    const fbApp  = firebase.initializeApp({
      apiKey: "AIzaSyBkV7nEO90Kby-MnGXOYOqK2Lh2Hdld7Xg",
      authDomain: "asconstruction-e7954.firebaseapp.com",
      projectId: "asconstruction-e7954",
      storageBucket: "asconstruction-e7954.firebasestorage.app",
      messagingSenderId: "650794536625",
      appId: "1:650794536625:web:0fab4ec617123b7883dc90"
    });
    const fbAuth = firebase.auth();
    window._fbdb             = firebase.firestore();
    const _provider = new firebase.auth.GoogleAuthProvider();
    window._firebaseSignIn         = () => fbAuth.signInWithPopup(_provider);
    window._firebaseSignInRedirect = () => fbAuth.signInWithRedirect(_provider);
    window._firebaseSignOut        = () => fbAuth.signOut();

    // Handle redirect result (for iOS Safari / popup-blocked fallback).
    // Errors here are non-critical — "missing initial state" just means no pending redirect.
    fbAuth.getRedirectResult().catch(e => {
      if (e.code !== 'auth/no-current-user') {
        console.warn('Firebase redirect result (non-critical):', e.code || e.message);
      }
    });

    fbAuth.onAuthStateChanged(user => {
      if (window._onAuthStateChanged) window._onAuthStateChanged(user);
    });
  } catch(e) {
    console.error('Firebase init error:', e);
    if (window._onAuthStateChanged) window._onAuthStateChanged(null);
  }
</script>

<script type="module">
  import Anthropic from 'https://esm.sh/@anthropic-ai/sdk';
  window._anthropicSend = async function(apiKey, system, messages) {
    const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
    const msg = await client.messages.create({
      model: 'claude-sonnet-4-6',
      max_tokens: 1024,
      system: system,
      messages: messages
    });
    return msg.content[0].text;
  };
</script>
